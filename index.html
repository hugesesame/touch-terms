<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Web Terms</title>
<style>
/* ============================================================
   アプリ本体の見た目（赤ペンの校正紙）
   ============================================================ */
:root {
  --paper: #faf8f4;
  --paper-2: #f1ede6;
  --ink: #24211d;
  --ink-2: #625c53;
  --line: #ddd6ca;
  --pen: #c2381a;          /* 赤ペン（朱色）。アクセントはこの1色だけ */
  --stage-pen: #c2381a;    /* 見本の上に書き込む赤ペン。見本は常に明るいので固定 */
  --bar: 56px;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #1a1917;
    --paper-2: #24221f;
    --ink: #ece7de;
    --ink-2: #a9a295;
    --line: #3a3631;
    --pen: #ff7a5c;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.75;
  word-break: auto-phrase;   /* 日本語を文節で折り返す（対応ブラウザのみ） */
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }

/* ---- 上の帯：アプリ名と5語の進み具合 ---- */
.bar {
  height: var(--bar);
  display: flex;
  align-items: center;
  gap: 32px;
  padding: 0 24px;
  border-bottom: 1px solid var(--line);
}
.brand { font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
.brand small { font-weight: 400; color: var(--ink-2); margin-left: 8px; font-size: 12px; }
.bar nav { min-width: 0; }
.terms {
  display: flex;
  gap: 4px;
  margin: 0;
  padding: 0;
  list-style: none;
  overflow-x: auto;
  scrollbar-width: none;
}
.terms button {
  display: flex;
  align-items: center;
  gap: 8px;
  height: var(--bar);
  padding: 0 12px;
  border: 0;
  border-bottom: 2px solid transparent;
  background: none;
  white-space: nowrap;
  cursor: pointer;
  color: var(--ink-2);
}
.terms .num { font-family: var(--mono); font-size: 12px; }
.terms button[aria-current="step"] { color: var(--ink); border-bottom-color: var(--pen); font-weight: 600; }
@media (hover: hover) { .terms button:hover { color: var(--ink); } }
.stamp {
  display: inline-grid;
  place-items: center;
  width: 20px; height: 20px;
  border: 1.5px solid var(--pen);
  border-radius: 50%;
  color: var(--pen);
  font-size: 11px;
  font-weight: 700;
  line-height: 1;
}

/* ---- 2列：左が見本（主役）、右が説明 ---- */
.layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 380px;
  grid-template-rows: minmax(0, 1fr);
  height: calc(100dvh - var(--bar));
}
.stage { padding: 20px; min-width: 0; min-height: 0; }
.panel {
  border-left: 1px solid var(--line);
  padding: 28px 28px 40px;
  overflow-y: auto;
}

/* 見本を入れる、ブラウザに見立てた枠 */
.browser {
  height: 100%;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
  background: var(--paper-2);   /* 画面を低くしたとき、残りは「画面の外」に見える */
}
.browser-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 34px;
  flex: none;
  padding: 0 12px;
  border-bottom: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink-2);
}
.browser-bar .dots { display: flex; gap: 5px; }
.browser-bar .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.viewport { flex: 1; min-height: 0; overflow: auto; position: relative; background: #fff; }

/* ---- 右の説明パネル ---- */
.count { font-family: var(--mono); font-size: 12px; color: var(--ink-2); margin: 0; }
.term-name { font-size: 30px; line-height: 1.3; margin: 4px 0 0; letter-spacing: .02em; }
.term-en { color: var(--ink-2); font-size: 14px; margin: 2px 0 0; }
.lead { margin: 14px 0 0; font-size: 16px; }

.tabs {
  display: flex;
  margin: 24px 0 20px;
  border-bottom: 1px solid var(--line);
}
.tabs button {
  flex: 1;
  padding: 10px 4px;
  border: 0;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  background: none;
  cursor: pointer;
  color: var(--ink-2);
}
.tabs button .num { font-family: var(--mono); font-size: 12px; margin-right: 6px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--pen); font-weight: 600; }

.step p { margin: 0 0 14px; }
.step .sub { color: var(--ink-2); font-size: 14px; }

.parts { list-style: none; margin: 0 0 18px; padding: 0; border-top: 1px solid var(--line); }
.parts button {
  width: 100%;
  display: grid;
  grid-template-columns: 8em 1fr;
  gap: 12px;
  padding: 10px 4px;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: none;
  text-align: left;
  cursor: pointer;
}
.parts b { font-weight: 600; }
.parts span { color: var(--ink-2); font-size: 14px; }
.parts button[aria-pressed="true"] b { color: var(--pen); }
@media (hover: hover) { .parts button:hover { background: var(--paper-2); } }

.switch {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 4px 0 18px;
  cursor: pointer;
  font-weight: 600;
}
.switch input { appearance: none; margin: 0; width: 42px; height: 24px; border-radius: 12px; border: 1.5px solid var(--ink-2); position: relative; cursor: pointer; flex: none; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 15px; height: 15px; border-radius: 50%; background: var(--ink-2); transition: transform .15s; }
.switch input:checked { background: var(--pen); border-color: var(--pen); }
.switch input:checked::after { transform: translateX(18px); background: var(--paper); }

/* つまみ */
.range { margin: 4px 0 16px; }
.range label { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-weight: 600; }
.range output { font-family: var(--mono); font-size: 13px; font-weight: 400; color: var(--pen); }
.range input { width: 100%; margin: 10px 0 0; accent-color: var(--pen); }
.verdict { min-height: 5.5em; }
.verdict b { color: var(--pen); margin-right: 6px; }

/* 行間の見比べ */
.choices { display: grid; gap: 10px; margin: 0 0 16px; }
.choices button {
  display: grid;
  grid-template-columns: 1.5em 1fr;
  gap: 8px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: none;
  text-align: left;
  cursor: pointer;
}
.choices .key { font-family: var(--mono); font-weight: 700; color: var(--ink-2); line-height: 1.6; }
.choices .sample { font-size: 13px; }
.choices button[aria-pressed="true"] { border-color: var(--pen); box-shadow: inset 0 0 0 1px var(--pen); }
.choices button[aria-pressed="true"] .key { color: var(--pen); }
@media (hover: hover) { .choices button:hover { background: var(--paper-2); } }

.feedback { min-height: 3.5em; }
.feedback .label { font-weight: 700; margin-right: 6px; }
.feedback .label.ok { color: var(--pen); }
.feedback .label.ng { color: var(--ink-2); }

.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
.btn {
  padding: 9px 16px;
  border-radius: 4px;
  border: 1px solid var(--ink);
  background: var(--ink);
  color: var(--paper);
  cursor: pointer;
  font-weight: 600;
}
.btn.quiet { background: none; color: var(--ink); border-color: var(--line); font-weight: 400; }
@media (hover: hover) {
  .btn:hover { opacity: .85; }
  .btn.quiet:hover { background: var(--paper-2); opacity: 1; }
}

/* ---- スマホ幅：見本が上、説明が下 ---- */
@media (max-width: 900px) {
  .bar { gap: 16px; padding: 0 0 0 16px; }
  .brand small { display: none; }
  .layout { display: block; height: auto; }
  /* 説明を読みながら見本を見られるよう、見本は画面の上に留める */
  .stage { padding: 12px; position: sticky; top: 0; z-index: 1; background: var(--paper); border-bottom: 1px solid var(--line); }
  .browser { height: 46dvh; }
  .panel { border-left: 0; padding: 20px 16px 48px; overflow: visible; }
}

/* 赤ペンの書き込み（見本の上に重ねる） */
.overlay { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.overlay text {
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 700;
  fill: var(--stage-pen);
  stroke: #fffaf0;
  stroke-width: 4px;
  paint-order: stroke;
  stroke-linejoin: round;
}
.overlay text.tag { fill: #fffaf0; stroke: none; font-size: 12px; }

/* ============================================================
   教材：架空のカフェのサイト「ひだまり珈琲店」
   アプリとは別のお店の見た目にしている。
   --sp（余白の倍率）と --lh（行の高さ）は、つまみで変えられる
   ============================================================ */
.site {
  --sp: 1;
  --lh: 1.8;
  --c-bg: #f7f0e3;
  --c-paper: #fbf6ec;
  --c-ink: #3b2a1f;
  --c-sub: #74604f;
  --c-accent: #8a5226;
  --c-line: #e2d3bb;
  --c-serif: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  position: relative;
  container-type: inline-size;
  min-height: 100%;
  background: var(--c-bg);
  color: var(--c-ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: var(--lh);
}
.site [hidden] { display: none !important; }
.site.quiz [data-part] { cursor: pointer; }
.site a { color: inherit; text-decoration: none; }
.site .cramped { --sp: .12; }   /* 「余白」の確かめる用：わざと余白を詰めた場所 */

.s-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: calc(16px * var(--sp)) calc(32px * var(--sp));
  background: var(--c-paper);
  border-bottom: 1px solid var(--c-line);
  line-height: 1.6;
}
.s-logo { display: flex; align-items: center; gap: 10px; font-family: var(--c-serif); font-weight: 700; font-size: 19px; letter-spacing: .06em; }
.s-nav ul { display: flex; gap: calc(24px * var(--sp)); margin: 0; padding: 0; list-style: none; font-size: 14px; }
.s-nav a { border-bottom: 1px solid transparent; padding-bottom: 2px; }
.s-nav a:hover { border-bottom-color: var(--c-accent); }

.s-hero {
  display: grid;
  grid-template-columns: 1.15fr .85fr;
  align-items: center;
  gap: calc(32px * var(--sp));
  padding: calc(64px * var(--sp)) calc(32px * var(--sp)) calc(72px * var(--sp));
}
.s-hero h1 { font-family: var(--c-serif); font-size: 34px; line-height: 1.45; margin: 0 0 calc(16px * var(--sp)); letter-spacing: .04em; }
.s-hero p { margin: 0 0 calc(28px * var(--sp)); color: var(--c-sub); }
.s-btn { display: inline-block; padding: 11px 22px; background: var(--c-accent); color: #fbf6ec !important; border-radius: 3px; font-size: 14px; letter-spacing: .06em; line-height: 1.6; }
.s-hero svg { width: 100%; max-width: 280px; justify-self: center; }

.s-section { padding: calc(56px * var(--sp)) calc(32px * var(--sp)); border-top: 1px solid var(--c-line); }
.s-section h2 { font-family: var(--c-serif); font-size: 22px; line-height: 1.5; margin: 0 0 calc(24px * var(--sp)); letter-spacing: .08em; }
.s-menu { margin: 0; max-width: 560px; }
.s-menu .row { display: flex; align-items: baseline; gap: 12px; font-weight: 600; }
.s-menu .row::after { content: ""; order: 1; flex: 1; border-bottom: 1px dotted var(--c-sub); transform: translateY(-4px); }
.s-menu .price { order: 2; font-family: var(--c-serif); }
.s-menu dd { margin: calc(4px * var(--sp)) 0 calc(22px * var(--sp)); color: var(--c-sub); font-size: 14px; }
.s-menu dd:last-child { margin-bottom: 0; }
.s-about p { margin: 0; max-width: 34em; }
.s-news { list-style: none; margin: 0; padding: 0; max-width: 560px; }
.s-news li { display: grid; grid-template-columns: 6em 1fr; gap: 12px; padding: calc(12px * var(--sp)) 0; border-bottom: 1px solid var(--c-line); }
.s-news li:first-child { padding-top: 0; }
.s-news time { color: var(--c-sub); font-size: 14px; }
.s-info { display: grid; grid-template-columns: 7em 1fr; gap: calc(10px * var(--sp)) calc(16px * var(--sp)); margin: 0; max-width: 560px; }
.s-info dt { color: var(--c-sub); font-size: 14px; }
.s-info dd { margin: 0; }

.s-footer { padding: calc(28px * var(--sp)) calc(32px * var(--sp)); background: #3b2a1f; color: #e9dcc6; font-size: 13px; }
.s-footer p { margin: 0; }
.s-footer p + p { margin-top: 4px; color: #bfae95; }

/* 見本サイト自身のレスポンシブ（見本の枠の幅で切り替わる） */
@container (max-width: 620px) {
  .s-header { flex-direction: column; align-items: flex-start; padding: calc(14px * var(--sp)) calc(20px * var(--sp)); gap: 8px; }
  .s-nav ul { gap: calc(16px * var(--sp)); flex-wrap: wrap; }
  .s-hero { grid-template-columns: 1fr; padding: calc(36px * var(--sp)) calc(20px * var(--sp)) calc(44px * var(--sp)); gap: calc(20px * var(--sp)); }
  .s-hero h1 { font-size: 26px; }
  .s-hero svg { max-width: 140px; justify-self: start; grid-row: 1; }
  .s-section { padding: calc(40px * var(--sp)) calc(20px * var(--sp)); }
  .s-news li { grid-template-columns: 1fr; gap: 0; }
  .s-footer { padding: calc(24px * var(--sp)) calc(20px * var(--sp)); }
}
</style>
</head>
<body>

<header class="bar">
  <div class="brand"><span data-t="app.name"></span><small data-t="app.note"></small></div>
  <nav aria-labelledby="terms-label">
    <span id="terms-label" hidden data-t="app.termsLabel"></span>
    <ol class="terms" id="terms"></ol>
  </nav>
</header>

<div class="layout">
  <section class="stage" aria-labelledby="stage-label">
    <span id="stage-label" hidden data-t="app.stageLabel"></span>
    <div class="browser">
      <div class="browser-bar" aria-hidden="true">
        <span class="dots"><i></i><i></i><i></i></span>
        <span data-t="site.url"></span>
      </div>
      <div class="viewport" id="viewport">

        <!-- ここから見本のサイト -->
        <div class="site" id="site">
          <header class="s-header" data-part="header">
            <a href="#" class="s-logo" data-part="logo">
              <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
                <circle cx="14" cy="14" r="13" fill="#f1dcb4"/>
                <path d="M8 13h10v3a5 5 0 0 1-10 0z" fill="#8a5226"/>
                <path d="M18 14h1.5a2 2 0 0 1 0 4H18" fill="none" stroke="#8a5226" stroke-width="1.5"/>
              </svg>
              <span data-t="site.name"></span>
            </a>
            <nav class="s-nav" data-part="nav">
              <ul>
                <li><a href="#" data-go="menu" data-t="site.nav.menu"></a></li>
                <li><a href="#" data-go="about" data-t="site.nav.about"></a></li>
                <li><a href="#" data-go="info" data-t="site.nav.access"></a></li>
                <li><a href="#" data-go="news" data-t="site.nav.news"></a></li>
              </ul>
            </nav>
          </header>

          <section class="s-hero" data-part="hero">
            <div>
              <h1 data-t="site.hero.title"></h1>
              <p data-t="site.hero.body"></p>
              <a href="#" class="s-btn" data-t="site.hero.button"></a>
            </div>
            <svg viewBox="0 0 240 200" aria-hidden="true">
              <circle cx="150" cy="78" r="62" fill="#f1dcb4"/>
              <path d="M96 40c-8 10 8 16 0 28M118 34c-8 10 8 16 0 28M140 40c-8 10 8 16 0 28" fill="none" stroke="#b9a283" stroke-width="3" stroke-linecap="round"/>
              <ellipse cx="118" cy="170" rx="86" ry="14" fill="#e2d3bb"/>
              <path d="M62 86h112v34c0 30-25 52-56 52s-56-22-56-52z" fill="#fbf6ec" stroke="#3b2a1f" stroke-width="3"/>
              <path d="M174 98h10a18 18 0 0 1 0 36h-14" fill="none" stroke="#3b2a1f" stroke-width="3"/>
              <ellipse cx="118" cy="86" rx="56" ry="9" fill="#6b3d1c" stroke="#3b2a1f" stroke-width="3"/>
            </svg>
          </section>

          <section class="s-section" data-part="menu">
            <h2 data-t="site.menu.title"></h2>
            <dl class="s-menu" id="s-menu"></dl>
          </section>

          <section class="s-section s-about" data-part="about">
            <h2 data-t="site.about.title"></h2>
            <p id="s-about-text" data-t="site.about.body"></p>
          </section>

          <section class="s-section" data-part="info">
            <h2 data-t="site.info.title"></h2>
            <dl class="s-info" id="s-info"></dl>
          </section>

          <section class="s-section" data-part="news">
            <h2 data-t="site.news.title"></h2>
            <ul class="s-news" id="s-news"></ul>
          </section>

          <footer class="s-footer" data-part="footer">
            <p data-t="site.footer.copy"></p>
            <p data-t="site.footer.note"></p>
          </footer>

          <svg class="overlay" id="overlay" aria-hidden="true"></svg>
        </div>
        <!-- 見本のサイトここまで -->

      </div>
    </div>
  </section>

  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>

<script>
/* ============================================================
   画面に出る文章は、すべてここにまとめる。
   英語を足すときは、ja と同じ形で en を並べる。
   ============================================================ */
const TEXT = {
  ja: {
    app: {
      name: 'Web Terms',
      note: '試作版',
      termsLabel: '学ぶ用語',
      stageLabel: '見本のサイト',
      done: '済',
      doneLabel: '学習済み',
      count: '用語 {n} / {total}',
      steps: { look: '見る', touch: '触る', check: '確かめる' },
      next: '次へ：{step}',
      nextTerm: '次の用語へ：{name}',
      allDone: '5つの用語を、すべて学び終わりました。',
      retry: 'もう一度',
      reset: 'もとに戻す',
      ok: '正解',
      ng: 'ちがいます',
      keys: 'キーボードでは Tab で場所を選び、Enter で答えられます。',
    },
    parts: {
      header: 'ヘッダー',
      logo: 'ロゴ',
      nav: 'ナビゲーション',
      hero: 'メインビジュアル',
      menu: 'メニュー',
      about: 'お店について',
      info: '営業時間・アクセス',
      news: 'お知らせ',
      footer: 'フッター',
    },
    terms: {
      /* ---------- 1. ヘッダー ---------- */
      header: {
        name: 'ヘッダー',
        en: 'Header',
        lead: 'ページのいちばん上にある、横長の帯のこと。',
        look: {
          p1: '見本のサイトで、赤い線で囲んだところがヘッダーです。',
          p2: 'このヘッダーには、次の2つが入っています。押すと、見本の中で場所を示します。',
          items: [
            { id: 'logo', label: 'ロゴ', desc: 'お店やサイトの名前・マーク' },
            { id: 'nav', label: 'ナビゲーション', desc: 'ほかのページへの入り口' },
          ],
          p3: 'ヘッダーは、ほとんどのサイトで全ページ共通です。どのページにいても、ここを見れば「どこのサイトか」「どこへ行けるか」がわかります。',
          tip: '見本のほかの場所にも、マウスを乗せて（スマホではタップして）みましょう。それぞれの名前が出ます。',
        },
        touch: {
          p1: 'ヘッダーをなくすと、サイトはどう見えるでしょう。スイッチを入れて、見本を見比べてみましょう。',
          switch: 'ヘッダーを隠す',
          after: 'どこのお店のサイトか、メニューやアクセスへどう行けばいいか、わかりにくくなりました。ヘッダーは、サイトの「看板」と「案内板」をまとめて引き受けています。',
        },
        check: {
          q: '見本の中で、ヘッダーだと思う場所をクリック（スマホではタップ）してください。',
          correct: 'ページのいちばん上の帯がヘッダーです。',
          correctSub: 'そこはヘッダーの中の「{name}」でした。{name}も、ヘッダーの一部です。',
          wrong: 'そこは「{name}」です。ヘッダーは、ページのいちばん上にあります。',
        },
      },

      /* ---------- 2. ナビゲーション ---------- */
      nav: {
        name: 'ナビゲーション',
        en: 'Navigation',

/* 学ぶ用語の並び */

let lang = 'ja';
const t = (key, vars) => {
  let s = key.split('.').reduce((o, k) => (o == null ? o : o[k]), TEXT[lang]);
  if (s == null) return key;
  if (vars && typeof s === 'string') s = s.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '');
  return s;
};

}

}

const part = (name) => site.querySelector(`[data-part="${name}"]`);

function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'on') for (const [ev, fn] of Object.entries(v)) el.addEventListener(ev, fn);
    else if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (v === true) el.setAttribute(k, '');
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const c of children.flat()) if (c != null && c !== false) el.append(c);
  return el;
}
const round1 = (n) => Math.round(n * 10) / 10;

function scrollStage(target) {
  if (!target) { vp.scrollTop = 0; return; }
  vp.scrollTop = Math.max(0, boxOf(part(target)).y - 12);
}

/* ============================================================
   赤ペンの書き込み（SVG）
   ============================================================ */
const NS = 'http://www.w3.org/2000/svg';
const svg = (tag, attrs = {}, text) => {
  const el = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  if (text != null) el.textContent = text;
  return el;
};
const PEN = 'var(--stage-pen)';
function boxOf(el) {
  const r = el.getBoundingClientRect();
  const s = site.getBoundingClientRect();
  return { x: r.left - s.left, y: r.top - s.top, w: r.width, h: r.height };
}
function defs() {
  const pattern = svg('pattern', { id: 'hatch', width: 7, height: 7, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' });
  pattern.append(svg('line', { x1: 0, y1: 0, x2: 0, y2: 7, stroke: PEN, 'stroke-width': 1.5, opacity: 0.5 }));
  const d = svg('defs');
  d.append(pattern);
  return d;
}

/* 囲み＋引き出し線＋名前 */
function annotate(el, label, { dashed = false } = {}) {
  if (!el || el.hidden) return [];
  const b = boxOf(el);
  const W = site.offsetWidth;
  const H = site.offsetHeight;
  const out = [svg('rect', {
    x: b.x + 3, y: b.y + 3, width: Math.max(0, b.w - 6), height: Math.max(0, b.h - 6),
    fill: 'none', stroke: PEN, 'stroke-width': dashed ? 1.5 : 2.5,
    'stroke-dasharray': dashed ? '6 4' : 'none', rx: 2,
  })];
  // 実線（主役）の名前は左、点線（補足）の名前は右に書いて、重ならないようにする
  const textW = label.length * 14;
  const right = dashed || b.x + 18 + textW + 12 > W;
  const lx = right ? b.x + b.w - 18 : b.x + 18;
  // 名前は、いま見えている範囲に収まる側に書く（下 → 上 → 枠の内側の順に試す）
  const seenTop = vp.scrollTop;
  const seenBottom = Math.min(H, vp.scrollTop + vp.clientHeight);
  if (b.y + b.h < seenTop || b.y > seenBottom) return out;  // 見えていない場所には名前を書かない
  const len = dashed ? 30 : 18;
  let where = 'inside';
  if (b.y + b.h + len + 16 < seenBottom && b.y + b.h > seenTop) where = 'below';
  else if (b.y - len - 16 > seenTop && b.y < seenBottom) where = 'above';
  const tx = right ? lx - 6 : lx + 6;
  const anchor = right ? 'end' : 'start';
  if (where === 'inside') {
    out.push(svg('text', { x: tx, y: Math.max(b.y, seenTop) + 12, 'text-anchor': anchor, 'dominant-baseline': 'hanging' }, label));
    return out;
  }
  const below = where === 'below';
  const y0 = below ? b.y + b.h - 3 : b.y + 3;
  const y1 = below ? y0 + len : y0 - len;
  out.push(
    svg('circle', { cx: lx, cy: y0, r: 3, fill: PEN }),
    svg('path', { d: `M${lx} ${y0} L${lx} ${y1}`, fill: 'none', stroke: PEN, 'stroke-width': 1.5 }),
    svg('text', { x: tx, y: below ? y1 + 5 : y1 + 1, 'text-anchor': anchor, 'dominant-baseline': below ? 'hanging' : 'auto' }, label),
  );
  return out;
}

/* 正解の赤丸（要素を囲む） */
function circle(el, label) {
  const b = boxOf(el);
  return loop(b.x + b.w / 2, b.y + b.h / 2, b.w / 2 - 14, b.h / 2 - 4, label, b.x + 18, b.y + b.h + 8);
}
/* 正解の赤丸（点を囲む） */
function ring(x, y, label) {
  return loop(x, y, 26, 18, label, x + 30, y - 22);
}
function loop(cx, cy, rx, ry, label, lx, ly) {
  // 手で描いたように、少しゆがませて1周より少し多く回す
  const start = Math.PI * 1.1;
  const pts = [];
  for (let i = 0; i <= 80; i++) {
    const a = start + (Math.PI * 2.12 * i) / 80;
    const k = 1 + 0.02 * Math.sin(a * 3) - 0.08 * (i / 80);
    pts.push(`${(cx + rx * k * Math.cos(a)).toFixed(1)} ${(cy + ry * k * Math.sin(a)).toFixed(1)}`);
  }
  return [
    svg('path', { d: `M${pts.join(' L')}`, fill: 'none', stroke: PEN, 'stroke-width': 2.5, 'stroke-linecap': 'round' }),
    svg('text', { x: lx, y: ly, 'dominant-baseline': 'hanging' }, label),
  ];
}

/* ちがう場所につける × */
function cross(x, y) {
  const s = 8;
  return [svg('path', {
    d: `M${x - s} ${y - s} L${x + s} ${y + s} M${x + s} ${y - s} L${x - s} ${y + s}`,
    stroke: PEN, 'stroke-width': 2.5, 'stroke-linecap': 'round',
  })];
}

/* ファーストビューの境目（折り目）。下側は薄く塗る */
function fold(label) {
  const y = foldY();
  const W = site.offsetWidth;
  const H = site.offsetHeight;
  // 名前は、見本の文字と重なっても読めるよう、赤い札にして書く
  const tagW = label.length * 13 + 16;
  return [
    svg('rect', { x: 0, y, width: W, height: Math.max(0, H - y), fill: PEN, opacity: 0.05 }),
    svg('path', { d: `M0 ${y} L${W} ${y}`, stroke: PEN, 'stroke-width': 2.5 }),
    svg('rect', { x: W - 12 - tagW, y: y - 22, width: tagW, height: 22, fill: PEN, rx: 2 }),
    svg('text', { x: W - 12 - tagW / 2, y: y - 11, 'text-anchor': 'middle', 'dominant-baseline': 'central', class: 'tag' }, label),
  ];
}
const foldY = () => vp.clientHeight;

/* 余白に斜線と大きさを書く */
function hatch(x, y, w, hgt, strong = true) {
  const n = Math.max(0, Math.round(hgt));
  const out = [svg('rect', { x, y, width: Math.max(0, w), height: Math.max(0, hgt), fill: 'url(#hatch)', opacity: strong ? 1 : 0.35 })];
  if (strong) out.push(svg('text', { x: x + w - 10, y: y + hgt / 2, 'text-anchor': 'end', 'dominant-baseline': 'middle' }, `${n}px`));
  return out;
}
function gaps() {
  const menu = part('menu');
  const h2 = $('h2', menu);
  const dl = $('.s-menu', menu);
  const dd = $('dd', dl);
  const dt2 = dl.querySelectorAll('dt')[1];
  const m = boxOf(menu), hb = boxOf(h2), db = boxOf(dl), ddb = boxOf(dd), d2 = boxOf(dt2);
  const top = parseFloat(getComputedStyle(menu).paddingTop);
  return {
    section: [m.x, m.y + 1, m.w, top],   // 上の 1px は区切りの線
    heading: [db.x, hb.y + hb.h, db.w, db.y - (hb.y + hb.h)],
    item: [db.x, ddb.y + ddb.h, db.w, d2.y - (ddb.y + ddb.h)],
  };
}

/* 行の区切り線 */
function rules() {
  const p = $('#s-about-text');
  const b = boxOf(p);
  const fs = parseFloat(getComputedStyle(p).fontSize);
  const lh = fs * state.lh;
  const n = Math.max(1, Math.round(b.h / lh));
  const out = [];
  for (let i = 0; i <= n; i++) {
    const y = b.y + i * lh;
    out.push(svg('path', { d: `M${b.x - 8} ${y} L${b.x + b.w} ${y}`, stroke: PEN, 'stroke-width': i === 0 || i === 1 ? 1.5 : 1, opacity: i <= 1 ? 1 : 0.6 }));
  }
  out.push(svg('text', { x: b.x, y: b.y - 8 }, t('terms.lineHeight.rule', { px: Math.round(lh) })));
  return out;
}

/* ============================================================
   用語ごとの中身
   ============================================================ */
const LESSONS = {
  header: {
    hoverNames: true,
    main: () => part('header'),
    items: { logo: () => part('logo'), nav: () => part('nav') },
    lookMarks: () => annotate(part('header'), t('parts.header')),
    touch() {
      return [
        h('p', {}, T('touch.p1')),
        h('label', { class: 'switch' },
          h('input', {
            type: 'checkbox', role: 'switch', checked: state.hidden,
            on: { change: (e) => { state.hidden = e.target.checked; applySite(); renderPanel(); draw(); } },
          }),
          T('touch.switch')),
        state.hidden ? h('p', {}, T('touch.after')) : null,
      ];
    },
    check: {
      inSample: true,
      judge(el) {
        const name = el.dataset.part;
        if (el.closest('[data-part="header"]')) return { correct: true, msg: name === 'header' ? 'correct' : 'correctSub', name };
        return { correct: false, msg: 'wrong', name };
      },
      marks: (a) => (a.correct ? circle(part('header'), t('app.ok')) : [...annotate(a.el, t(`parts.${a.name}`), { dashed: true }), ...cross(a.x, a.y)]),
    },
  },

  nav: {
    hoverNames: true,
    main: () => part('nav'),
    items: Object.fromEntries(['menu', 'about', 'info', 'news'].map((id) => [id, () => site.querySelector(`[data-go="${id}"]`)])),
    lookMarks: () => annotate(part('nav'), t('parts.nav')),
    touch() {
      return [
        h('p', {}, T('touch.p1')),
        state.moved ? h('p', {}, T('touch.moved', { name: t(`parts.${state.moved}`) })) : null,
        state.moved ? h('p', { class: 'sub' }, T('touch.back')) : null,
        state.moved ? h('div', { class: 'actions' }, h('button', {
          type: 'button', class: 'btn quiet',
          on: { click: () => { vp.scrollTo({ top: 0, behavior: 'smooth' }); } },
        }, T('touch.top'))) : null,
      ];
    },
    touchMarks: () => annotate(part('nav'), t('parts.nav')),
    check: {
      inSample: true,
      judge(el) {
        const name = el.dataset.part;
        if (el.closest('[data-part="nav"]')) return { correct: true, msg: 'correct', name };
        if (el.closest('[data-part="header"]')) return { correct: false, msg: 'near', name };
        return { correct: false, msg: 'wrong', name };
      },
      marks: (a) => (a.correct ? circle(part('nav'), t('app.ok')) : [...annotate(a.el, t(`parts.${a.name}`), { dashed: true }), ...cross(a.x, a.y)]),
    },
  },

  fv: {
    hoverNames: true,
    items: { logo: () => part('logo'), nav: () => part('nav'), hero: () => part('hero') },
    lookMarks: () => fold(T('fold')),
    touch() {
      const out = h('div', { class: 'verdict', id: 'fv-out' });
      const update = () => {
        const targets = {
          logo: part('logo'), nav: part('nav'),
          title: $('.s-hero h1'), button: $('.s-hero .s-btn'), art: $('.s-hero svg'),
        };
        const inside = [], outside = [];
        for (const [k, el] of Object.entries(targets)) {
          const b = boxOf(el);
          (b.y + b.h <= foldY() + 1 ? inside : outside).push(T(`touch.targets.${k}`));
        }
        const sep = '、';
        out.replaceChildren(
          h('p', {}, T('touch.inside', { list: inside.join(sep) || T('touch.none') })),
          h('p', {}, T('touch.outside', { list: outside.join(sep) || T('touch.none') })),
          outside.includes(T('touch.targets.button')) ? h('p', { class: 'sub' }, T('touch.warn')) : null,
        );
      };
      requestAnimationFrame(update);
      return [
        h('p', {}, T('touch.p1')),
        rangeRow({
          label: T('touch.label'), min: 160, max: state.vpMax, step: 10, value: state.vpH || state.vpMax,
          format: (v) => T('touch.value', { n: v }),
          onInput: (v) => { state.vpH = v; vp.scrollTop = 0; applySite(); draw(); update(); },
        }),
        out,
      ];
    },
    touchMarks: () => fold(T('fold')),
    check: {
      inSample: true,
      judge(el, x, y) {
        return { correct: y > foldY(), msg: y > foldY() ? 'correct' : 'wrong', name: el.dataset.part };
      },
      marks: (a) => [...fold(T('check.fold')), ...(a.correct ? ring(a.x, a.y, t('app.ok')) : cross(a.x, a.y))],
    },
  },

  space: {
    focus: 'menu',
    lookMarks(pinned) {
      const g = gaps();
      return Object.entries(g).flatMap(([id, r]) => (!pinned || pinned === id ? hatch(...r) : []));
    },
    touch() {
      const verdict = h('div', { class: 'verdict' });
      const update = (v) => {
        const key = v < 0.6 ? 'tight' : v > 1.5 ? 'loose' : 'ok';
        const [title, body] = T(`touch.${key}`);
        verdict.replaceChildren(h('p', {}, h('b', {}, title), body));
      };
      update(state.space);
      const row = rangeRow({
        label: T('touch.label'), min: 0, max: 200, step: 10, value: Math.round(state.space * 100),
        format: (v) => T('touch.value', { n: v }),
        onInput: (v) => { state.space = v / 100; applySite(); draw(); update(state.space); },
      });
      const set = (v) => { const input = $('input', row); input.value = v; input.dispatchEvent(new Event('input')); };
      return [
        h('p', {}, T('touch.p1')),
        row,
        verdict,
        h('div', { class: 'actions' },
          h('button', { type: 'button', class: 'btn quiet', on: { click: () => set(0) } }, T('touch.zero')),
          h('button', { type: 'button', class: 'btn quiet', on: { click: () => set(100) } }, t('app.reset'))),
      ];
    },
    touchMarks() { return Object.values(gaps()).flatMap((r) => hatch(...r)); },
    check: {
      inSample: true,
      judge(el) {
        const ok = !!el.closest('[data-part="info"]');
        return { correct: ok, msg: ok ? 'correct' : 'wrong', name: el.dataset.part };
      },
      marks: (a) => (a.correct ? circle(part('info'), t('app.ok')) : [...annotate(a.el, t(`parts.${a.name}`), { dashed: true }), ...cross(a.x, a.y)]),
    },
  },

  lineHeight: {
    focus: 'about',
    lookVars: () => ({ fs: 15, px: Math.round(15 * state.lh), v: state.lh }),
    lookMarks: () => rules(),
    touch() {
      const verdict = h('div', { class: 'verdict' });
      const update = (v) => {
        const key = v < 1.4 ? 'tight' : v > 2.3 ? 'loose' : 'ok';
        const [title, body] = T(`touch.${key}`);
        verdict.replaceChildren(h('p', {}, h('b', {}, title), body));
      };
      update(state.lh);
      const row = rangeRow({
        label: T('touch.label'), min: 1, max: 3, step: 0.1, value: state.lh,
        format: (v) => T('touch.value', { v: round1(v).toFixed(1), px: Math.round(15 * v) }),
        onInput: (v) => { state.lh = round1(v); applySite(); draw(); update(state.lh); },
      });
      const set = (v) => { const input = $('input', row); input.value = v; input.dispatchEvent(new Event('input')); };
      return [
        h('p', {}, T('touch.p1')),
        row,
        verdict,
        h('div', { class: 'actions' }, h('button', { type: 'button', class: 'btn quiet', on: { click: () => set(DEFAULT.lh) } }, t('app.reset'))),
      ];
    },
    touchMarks: () => rules(),
    check: {
      inSample: false,
      choices: [1.1, 3.0, 1.8],
      answers: ['wrongA', 'wrongB', 'correct'],
    },
  },
};

/* つまみ（ラベル・いまの値・スライダー） */
function rangeRow({ label, min, max, step, value, format, onInput }) {
  const id = `range-${Math.random().toString(36).slice(2, 7)}`;
  const output = h('output', { for: id }, format(Number(value)));
  const input = h('input', {
    id, type: 'range', min, max, step, value,
    on: { input: (e) => { const v = Number(e.target.value); output.textContent = format(v); onInput(v); } },
  });
  return h('div', { class: 'range' }, h('label', { for: id }, label, output), input);
}

/* ============================================================
   画面を組み立てる
   ============================================================ */
function renderTerms() {
  $('#terms').replaceChildren(...TERMS.map((id, i) => h('li', {},
    h('button', {
      type: 'button',
      'aria-current': id === state.term ? 'step' : false,
      on: { click: () => selectTerm(id) },
    },
      h('span', { class: 'num' }, String(i + 1).padStart(2, '0')),
      t(`terms.${id}.name`),
      state.progress[id] ? h('span', { class: 'stamp', title: t('app.doneLabel'), 'aria-label': t('app.doneLabel') }, t('app.done')) : null))));
}

function renderPanel() {
  const L = LESSONS[state.term];
  const idx = TERMS.indexOf(state.term);

  const tabs = h('div', { class: 'tabs', role: 'tablist' }, STEPS.map((s, i) => h('button', {
    type: 'button', role: 'tab',
    'aria-selected': String(s === state.step),
    on: { click: () => setStep(s) },
  }, h('span', { class: 'num' }, i + 1), t(`app.steps.${s}`))));

  const nextStep = STEPS[STEPS.indexOf(state.step) + 1];
  const nextBtn = nextStep
    ? h('div', { class: 'actions' }, h('button', { type: 'button', class: 'btn', on: { click: () => setStep(nextStep) } }, t('app.next', { step: t(`app.steps.${nextStep}`) })))
    : null;

  let body;
  if (state.step === 'look') {
    const vars = L.lookVars ? L.lookVars() : undefined;
    const items = T('look.items');
    body = [
      h('p', {}, T('look.p1', vars)),
      h('p', {}, T('look.p2', vars)),
      Array.isArray(items) ? h('ul', { class: 'parts' }, items.map((it) => h('li', {},
        h('button', {
          type: 'button',
          'aria-pressed': String(state.pinned === it.id),
          on: { click: () => pin(it.id) },
        }, h('b', {}, it.label), h('span', {}, it.desc))))) : null,
      h('p', {}, T('look.p3', vars)),
      h('p', { class: 'sub' }, T('look.tip', vars)),
      nextBtn,
    ];
  } else if (state.step === 'touch') {
    body = [...L.touch(), nextBtn];
  } else {
    body = renderCheck(L);
  }

  panel.replaceChildren(
    h('p', { class: 'count' }, t('app.count', { n: idx + 1, total: TERMS.length })),
    h('h1', { class: 'term-name' }, T('name')),
    h('p', { class: 'term-en', lang: 'en' }, T('en')),
    h('p', { class: 'lead' }, T('lead')),
    tabs,
    h('div', { class: 'step', role: 'tabpanel' }, body),
  );
}

function renderCheck(L) {
  const a = state.answer;
  const out = [h('p', {}, T('check.q'))];
  if (L.check.inSample) out.push(h('p', { class: 'sub' }, t('app.keys')));
  if (L.check.choices) {
    out.push(h('div', { class: 'choices' }, L.check.choices.map((lh, i) => h('button', {
      type: 'button',
      'aria-pressed': String(!!a && a.choice === i),
      on: { click: () => choose(i) },
    }, h('span', { class: 'key' }, 'ABC'[i]), h('span', { class: 'sample', style: `line-height:${lh}` }, T('check.sample'))))));
  }
  if (a) {
    out.push(h('div', { class: 'feedback' },
      h('p', {},
        h('span', { class: `label ${a.correct ? 'ok' : 'ng'}` }, t(a.correct ? 'app.ok' : 'app.ng')),
        T(`check.${a.msg}`, { name: a.name ? t(`parts.${a.name}`) : '' }))));
    const next = TERMS[TERMS.indexOf(state.term) + 1];
    const actions = h('div', { class: 'actions' });
    if (a.correct && next) actions.append(h('button', { type: 'button', class: 'btn', on: { click: () => selectTerm(next) } }, t('app.nextTerm', { name: t(`terms.${next}.name`) })));
    if (a.correct && !next && TERMS.every((id) => state.progress[id])) out.push(h('p', { class: 'sub' }, t('app.allDone')));
    actions.append(h('button', { type: 'button', class: 'btn quiet', on: { click: () => { state.answer = null; renderPanel(); draw(); } } }, t('app.retry')));
    out.push(actions);
  }
  return out;
}

/* ---- 切り替え ---- */
function resetTouch() {
  state.hidden = false;
  state.moved = null;
  state.vpH = null;
  state.space = DEFAULT.space;
  state.lh = DEFAULT.lh;
}

function selectTerm(id) {
  state.term = id;
  panel.scrollTop = 0;
  if (matchMedia('(max-width: 900px)').matches) window.scrollTo({ top: 0 });
  setStep('look');
}

function setStep(step) {
  state.step = step;
  state.hover = null;
  state.pinned = null;
  state.answer = null;
  resetTouch();
  applySite();
  if (step === 'touch' && state.term === 'fv') state.vpMax = vp.clientHeight;
  const L = LESSONS[state.term];
  scrollStage(step === 'check' && state.term !== 'lineHeight' ? null : L.focus);
  renderTerms();
  renderPanel();
  draw();
}

function pin(id) {
  state.pinned = state.pinned === id ? null : id;
  const L = LESSONS[state.term];
  const el = state.pinned && L.items && L.items[id] ? L.items[id]() : null;
  if (el) {
    // ページ全体は動かさず、見本の枠の中だけをスクロールする
    const b = boxOf(el);
    if (b.y < vp.scrollTop || b.y + b.h > vp.scrollTop + vp.clientHeight) {
      vp.scrollTo({ top: Math.max(0, b.y - 24), behavior: 'smooth' });
    }
  }
  renderPanel();
  draw();
}

/* ---- 確かめる：答え合わせ ---- */
function record(correct) {
  if (correct && !state.progress[state.term]) {
    state.progress[state.term] = true;
    saveProgress();
    renderTerms();
  }
}
function answer(target, x, y) {
  const el = target.closest('[data-part]');
  if (!el) return;
  const r = LESSONS[state.term].check.judge(el, x, y);
  state.answer = { ...r, el, x, y };
  record(r.correct);
  renderPanel();
  draw();
}
function choose(i) {
  const c = LESSONS.lineHeight.check;
  state.answer = { choice: i, correct: c.answers[i] === 'correct', msg: c.answers[i] };
  record(state.answer.correct);
  renderPanel();
}

/* ---- 書き込みを描き直す ---- */
function draw() {
  overlay.setAttribute('width', site.offsetWidth);
  overlay.setAttribute('height', site.offsetHeight);
  const L = LESSONS[state.term];
  const marks = [defs()];
  const name = (el) => t(`parts.${el.dataset.part}`);

  if (state.step === 'look') {
    marks.push(...L.lookMarks(state.pinned));
    if (state.pinned && L.items && L.items[state.pinned]) {
      const it = T('look.items').find((x) => x.id === state.pinned);
      marks.push(...annotate(L.items[state.pinned](), it.label, { dashed: true }));
    } else if (L.hoverNames && state.hover && state.hover !== (L.main && L.main())) {
      marks.push(...annotate(state.hover, name(state.hover), { dashed: true }));
    }
  }
  if (state.step === 'touch' && L.touchMarks) marks.push(...L.touchMarks());
  if (state.step === 'check' && state.answer && L.check.marks) marks.push(...L.check.marks(state.answer));
  overlay.replaceChildren(...marks);
}

/* ---- 見本のサイトでの操作 ---- */
site.addEventListener('pointermove', (e) => {
  if (state.step !== 'look' || state.pinned || !LESSONS[state.term].hoverNames) return;
  const el = e.target.closest('[data-part]');
  if (el !== state.hover) { state.hover = el; draw(); }
});
site.addEventListener('pointerleave', () => {
  if (state.step !== 'look' || state.pinned) return;
  state.hover = null;
  draw();
});
site.addEventListener('click', (e) => {
  const link = e.target.closest('a');
  if (link) e.preventDefault();  // 見本のリンクでは、ふつうはページを移動しない

  // ナビゲーションの「触る」だけは、本当に移動する
  if (state.term === 'nav' && state.step === 'touch' && link && link.dataset.go) {
    state.moved = link.dataset.go;
    vp.scrollTo({ top: Math.max(0, boxOf(part(link.dataset.go)).y), behavior: 'smooth' });
    renderPanel();
    return;
  }
  if (state.step === 'look' && LESSONS[state.term].hoverNames) {
    if (state.pinned) { state.pinned = null; renderPanel(); }
    state.hover = e.target.closest('[data-part]');
    draw();
  } else if (state.step === 'check' && LESSONS[state.term].check.inSample) {
    const s = site.getBoundingClientRect();
    answer(e.target, e.clientX - s.left, e.clientY - s.top);
  }
});
site.addEventListener('keydown', (e) => {
  if (state.step !== 'check' || (e.key !== 'Enter' && e.key !== ' ')) return;
  const el = e.target.closest('[data-part]');
  if (!el) return;
  e.preventDefault();
  e.stopPropagation();
  const b = boxOf(el);
  answer(el, b.x + Math.min(b.w / 2, 40), b.y + b.h / 2);
});

new ResizeObserver(() => draw()).observe(site);
// 見本をスクロールしたら、名前を見える位置に書き直す
let drawQueued = false;
vp.addEventListener('scroll', () => {
  if (drawQueued) return;
  drawQueued = true;
  requestAnimationFrame(() => { drawQueued = false; draw(); });
}, { passive: true });

/* ---- はじめる ---- */
applyText();
setStep('look');
</script>
</body>
</html>
