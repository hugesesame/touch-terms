<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Touch Terms</title>
<style>
/* ============================================================
   アプリ本体の見た目（赤ペンの校正紙）
   ============================================================ */
:root {
  --paper: #faf8f4;
  --paper-2: #f1ede6;
  --ink: #24211d;
  --ink-2: #625c53;
  --line: #ddd6ca;
  --pen: #c2381a;          /* 赤ペン（朱色）。アクセントはこの1色だけ */
  --stage-pen: #c2381a;    /* 見本の上に書き込む赤ペン。見本は常に明るいので固定 */
  --bar: 56px;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #1a1917;
    --paper-2: #24221f;
    --ink: #ece7de;
    --ink-2: #a9a295;
    --line: #3a3631;
    --pen: #ff7a5c;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.75;
  word-break: auto-phrase;   /* 日本語を文節で折り返す（対応ブラウザのみ） */
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }

/* ---- 上の帯：アプリ名・用語一覧・前へ／次へ ---- */
.bar {
  height: var(--bar);
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 20px 0 24px;
  border-bottom: 1px solid var(--line);
}
.brand { font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
.brand small { font-weight: 400; color: var(--ink-2); margin-left: 8px; font-size: 12px; }
.bar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.bar .progress { font-family: var(--mono); font-size: 12px; color: var(--ink-2); margin-right: 8px; white-space: nowrap; }
.bar-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: none;
  white-space: nowrap;
  cursor: pointer;
}
.bar-btn:disabled { opacity: .4; cursor: default; }
.bar-btn svg { flex: none; }
@media (hover: hover) { .bar-btn:not(:disabled):hover { background: var(--paper-2); } }
.stamp {
  display: inline-grid;
  place-items: center;
  width: 20px; height: 20px;
  border: 1.5px solid var(--pen);
  border-radius: 50%;
  color: var(--pen);
  font-size: 11px;
  font-weight: 700;
  line-height: 1;
}

/* ---- 用語一覧（ドロワー） ---- */
dialog.list {
  margin: 0;
  padding: 0;
  border: 0;
  border-right: 1px solid var(--line);
  width: min(360px, 90vw);
  height: 100dvh;
  max-height: 100dvh;
  background: var(--paper);
  color: var(--ink);
}
dialog.list::backdrop { background: rgba(20, 18, 16, .4); }
@media (prefers-reduced-motion: no-preference) {
  dialog.list[open] { animation: slide-in .2s ease-out; }
  @keyframes slide-in { from { transform: translateX(-100%); } }
}
.list-head {
  position: sticky;
  top: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  height: var(--bar);
  padding: 0 16px 0 20px;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
}
.list-head h2 { font-size: 16px; margin: 0; }
.list-head .progress { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.list-head .bar-btn { margin-left: auto; }
.list-body { padding: 4px 14px 40px; }
.list-body h3 { font-size: 13px; color: var(--ink-2); margin: 22px 6px 6px; font-weight: 600; }
.list-body ol { list-style: none; margin: 0; padding: 0; }
.list-body button {
  width: 100%;
  display: grid;
  grid-template-columns: 2.2em 1fr auto;
  align-items: center;
  gap: 6px;
  padding: 8px 6px;
  border: 0;
  border-radius: 3px;
  background: none;
  text-align: left;
  cursor: pointer;
}
.list-body .num { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.list-body button[aria-current="page"] .name { color: var(--pen); font-weight: 700; }
.list-body button:disabled { cursor: default; color: var(--ink-2); }
.list-body .soon { font-size: 11px; color: var(--ink-2); }
@media (hover: hover) { .list-body button:not(:disabled):hover { background: var(--paper-2); } }

/* ---- 2列：左が見本（主役）、右が説明 ---- */
.layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 380px;
  grid-template-rows: minmax(0, 1fr);
  height: calc(100dvh - var(--bar));
}
.stage { padding: 20px; min-width: 0; min-height: 0; }
.panel {
  border-left: 1px solid var(--line);
  padding: 28px 28px 40px;
  overflow-y: auto;
}

/* 見本を入れる、ブラウザに見立てた枠 */
.browser {
  height: 100%;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
  background: var(--paper-2);   /* 画面を小さくしたとき、残りは「画面の外」に見える */
}
.browser-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 34px;
  flex: none;
  padding: 0 12px;
  border-bottom: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink-2);
  overflow: hidden;
  white-space: nowrap;
}
.browser-bar .dots { display: flex; gap: 5px; flex: none; }
.browser-bar .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.browser-bar .url { overflow: hidden; text-overflow: ellipsis; }
.viewport { flex: 1; min-height: 0; overflow: auto; position: relative; background: #fff; }
/* ファビコンの用語のときだけ出す、ブラウザのタブとブックマーク */
.b-tabs[hidden], .b-marks[hidden] { display: none; }
.b-tabs { position: relative; z-index: 2; display: flex; gap: 2px; padding: 6px 8px 0; background: var(--line); flex: none; }
.b-tab { flex: 0 1 180px; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 0; border-radius: 6px 6px 0 0; background: none; color: var(--ink-2); font: 12px var(--sans); text-align: left; cursor: default; }
.b-tab[aria-current="true"] { background: var(--paper-2); color: var(--ink); }
.b-tab .t { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.b-tabs.icons-only .b-tab { flex: 0 1 44px; justify-content: center; padding: 7px 0; }
.b-tabs.icons-only .t { display: none; }
.b-tabs.pick .b-tab { cursor: pointer; }
@media (hover: hover) { .b-tabs.pick .b-tab:hover { background: var(--paper-2); } }
.b-marks { display: flex; gap: 18px; padding: 6px 12px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--ink-2); flex: none; overflow: hidden; white-space: nowrap; }
.b-mark { display: flex; align-items: center; gap: 6px; }
.b-fav { position: relative; display: block; flex: none; width: 16px; height: 16px; }
.b-fav svg { display: block; width: 16px; height: 16px; }
.b-fav.marked { outline: 2.5px solid var(--stage-pen); outline-offset: 3px; border-radius: 3px; }
.b-fav.marked::after {   /* 赤ペンの名前 */
  content: attr(data-label);
  position: absolute;
  left: -6px;
  top: calc(100% + 9px);
  padding: 1px 6px;
  border-radius: 2px;
  background: var(--stage-pen);
  color: #fffaf0;
  font: 700 12px var(--sans);
  white-space: nowrap;
}
.viewport.locked { overflow: hidden; }

/* ---- 右の説明パネル ---- */
.count { font-family: var(--mono); font-size: 12px; color: var(--ink-2); margin: 0; }
.term-name { font-size: 30px; line-height: 1.3; margin: 4px 0 0; letter-spacing: .02em; }
.term-en { color: var(--ink-2); font-size: 14px; margin: 2px 0 0; }
.lead { margin: 14px 0 0; font-size: 16px; }

.tabs {
  display: flex;
  margin: 24px 0 20px;
  border-bottom: 1px solid var(--line);
}
.tabs button {
  flex: 1;
  padding: 10px 4px;
  border: 0;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  background: none;
  cursor: pointer;
  color: var(--ink-2);
}
.tabs button .num { font-family: var(--mono); font-size: 12px; margin-right: 6px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--pen); font-weight: 600; }

.step p { margin: 0 0 14px; }
.step .sub { color: var(--ink-2); font-size: 14px; }

.parts { list-style: none; margin: 0 0 18px; padding: 0; border-top: 1px solid var(--line); }
.parts button {
  width: 100%;
  display: grid;
  grid-template-columns: 8.5em 1fr;
  gap: 12px;
  padding: 10px 4px;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: none;
  text-align: left;
  cursor: pointer;
}
.parts b { font-weight: 600; }
.parts span { color: var(--ink-2); font-size: 14px; }
.parts button[aria-pressed="true"] b { color: var(--pen); }
@media (hover: hover) { .parts button:hover { background: var(--paper-2); } }

.switch {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 4px 0 18px;
  cursor: pointer;
  font-weight: 600;
}
.switch input { appearance: none; margin: 0; width: 42px; height: 24px; border-radius: 12px; border: 1.5px solid var(--ink-2); position: relative; cursor: pointer; flex: none; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 15px; height: 15px; border-radius: 50%; background: var(--ink-2); transition: transform .15s; }
.switch input:checked { background: var(--pen); border-color: var(--pen); }
.switch input:checked::after { transform: translateX(18px); background: var(--paper); }

/* つまみ */
.range { margin: 4px 0 16px; }
/* 文字を書き込む欄（OGP） */
.field { margin: 0 0 14px; }
.field label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
.field input { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); color: var(--ink); font: inherit; font-size: 14px; }
.field input:focus-visible { outline: 2px solid var(--pen); outline-offset: 1px; }
.field input:disabled { opacity: .5; }
/* ページに書くコード */
.code-label { font-size: 13px; font-weight: 600; margin: 16px 0 6px; }
.code { margin: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--paper-2); font: 12px/1.7 var(--mono); white-space: pre-wrap; word-break: break-all; }
.range label { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-weight: 600; }
.range output { font-family: var(--mono); font-size: 13px; font-weight: 400; color: var(--pen); }
.range input { width: 100%; margin: 10px 0 0; accent-color: var(--pen); }
.verdict { min-height: 5.5em; }
.verdict b { color: var(--pen); margin-right: 6px; }

/* 行間の見比べ */
.choices { display: grid; gap: 10px; margin: 0 0 16px; }
.choices button {
  display: grid;
  grid-template-columns: 1.5em 1fr;
  gap: 8px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: none;
  text-align: left;
  cursor: pointer;
}
.choices .key { font-family: var(--mono); font-weight: 700; color: var(--ink-2); line-height: 1.6; }
.choices .sample { font-size: 13px; }
.choices button[aria-pressed="true"] { border-color: var(--pen); box-shadow: inset 0 0 0 1px var(--pen); }
.choices button[aria-pressed="true"] .key { color: var(--pen); }
@media (hover: hover) { .choices button:hover { background: var(--paper-2); } }

.feedback { min-height: 3.5em; }
.feedback .label { font-weight: 700; margin-right: 6px; }
.feedback .label.ok { color: var(--pen); }
.feedback .label.ng { color: var(--ink-2); }
.event { color: var(--ink); }
.event b { color: var(--pen); margin-right: 6px; }
.actions + .event { margin-top: 16px; }   /* ボタンのすぐ下に結果を書くときは、少し離す */

.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
.btn {
  padding: 9px 16px;
  border-radius: 4px;
  border: 1px solid var(--ink);
  background: var(--ink);
  color: var(--paper);
  cursor: pointer;
  font-weight: 600;
}
.btn.quiet { background: none; color: var(--ink); border-color: var(--line); font-weight: 400; }
.btn.quiet[aria-pressed="true"] { border-color: var(--pen); color: var(--pen); box-shadow: inset 0 0 0 1px var(--pen); font-weight: 600; }   /* いま選んでいるもの */
@media (hover: hover) {
  .btn:hover { opacity: .85; }
  .btn.quiet:hover { background: var(--paper-2); opacity: 1; }
}

/* ---- スマホ幅：見本が上、説明が下 ---- */
@media (max-width: 900px) {
  .bar { gap: 10px; padding: 0 12px 0 16px; }
  .brand small, .bar .progress { display: none; }
  .bar-btn { padding: 0 10px; }
  .layout { display: block; height: auto; }
  /* 説明を読みながら見本を見られるよう、見本は画面の上に留める */
  .stage { padding: 12px; position: sticky; top: 0; z-index: 1; background: var(--paper); border-bottom: 1px solid var(--line); }
  .browser { height: 46dvh; }
  .panel { border-left: 0; padding: 20px 16px 48px; overflow: visible; }
}
@media (max-width: 380px) { .brand { display: none; } }

/* 赤ペンの書き込み（見本の上に重ねる） */
.overlay { position: absolute; inset: 0; pointer-events: none; overflow: visible; z-index: 10; }
.overlay text {
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 700;
  fill: var(--stage-pen);
  stroke: #fffaf0;
  stroke-width: 4px;
  paint-order: stroke;
  stroke-linejoin: round;
}
.overlay text.tag { fill: #fffaf0; stroke: none; font-size: 12px; }

/* ============================================================
   教材：架空のカフェのサイト「ひだまり珈琲店」
   アプリとは別のお店の見た目にしている。
   --sp（余白の倍率）と --lh（行の高さ）は、つまみで変えられる
   ============================================================ */
.site {
  --sp: 1;
  --lh: 1.8;
  --cm: 10px;   /* カードのマージン */
  --cp: 14px;   /* カードのパディング */
  --c-bg: #f7f0e3;
  --c-paper: #fbf6ec;
  --c-ink: #3b2a1f;
  --c-sub: #74604f;
  --c-accent: #8a5226;
  --c-line: #e2d3bb;
  --c-err: #a3341b;
  --c-serif: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  position: relative;
  container-type: inline-size;
  min-height: 100%;
  background: var(--c-bg);
  color: var(--c-ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: var(--lh);
}
.site [hidden] { display: none !important; }
.site.quiz [data-part] { cursor: pointer; }
.site a { color: inherit; text-decoration: none; }
.site button { cursor: pointer; }
.site .cramped { --sp: .12; }   /* 「余白」の確かめる用：わざと余白を詰めた場所 */

/* ヘッダー */
.s-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: calc(16px * var(--sp)) calc(32px * var(--sp));
  background: var(--c-paper);
  border-bottom: 1px solid var(--c-line);
  line-height: 1.6;
}
.s-logo { display: flex; align-items: center; gap: 10px; font-family: var(--c-serif); font-weight: 700; font-size: 19px; letter-spacing: .06em; }
.s-nav ul { display: flex; gap: calc(22px * var(--sp)); margin: 0; padding: 0; list-style: none; font-size: 14px; }
.s-nav a { border-bottom: 1px solid transparent; padding-bottom: 2px; }
.s-burger { display: none; width: 40px; height: 40px; place-items: center; border: 1px solid var(--c-line); border-radius: 4px; background: none; padding: 0; }
.s-burger span { display: block; width: 18px; height: 2px; background: var(--c-ink); box-shadow: 0 -6px 0 var(--c-ink), 0 6px 0 var(--c-ink); }
.site.compact .s-nav { display: none; }
.site.compact .s-burger { display: inline-grid; }
.site.compact .s-header { flex-direction: row; align-items: center; }
/* 固定ヘッダーの用語のときだけ、ヘッダーを見本の画面の上にくっつける */
.site.sticky .s-header { position: sticky; top: 0; z-index: 4; }

/* ヒーロー */
.s-hero {
  display: grid;
  grid-template-columns: 1.15fr .85fr;
  align-items: center;
  gap: calc(32px * var(--sp));
  padding: calc(64px * var(--sp)) calc(32px * var(--sp)) calc(72px * var(--sp));
}
.s-hero h1 { font-family: var(--c-serif); font-size: 34px; line-height: 1.45; margin: 0 0 calc(16px * var(--sp)); letter-spacing: .04em; }
.s-hero p { margin: 0 0 calc(28px * var(--sp)); color: var(--c-sub); }
.s-hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px; }
.s-btn { display: inline-block; padding: 11px 22px; border: 0; background: var(--c-accent); color: #fbf6ec !important; border-radius: 3px; font: inherit; font-size: 14px; letter-spacing: .06em; line-height: 1.6; }
.s-sublink { font-size: 14px; border-bottom: 1px solid currentColor; }
.s-hero > svg { width: 100%; max-width: 280px; justify-self: center; }
.site.cta-weak .s-btn[data-part="cta"] { background: none; color: var(--c-sub) !important; padding: 0; font-size: 13px; letter-spacing: 0; }

/* セクション（トップページ） */
.s-section { padding: calc(56px * var(--sp)) calc(32px * var(--sp)); border-top: 1px solid var(--c-line); }
.s-section h2 { font-family: var(--c-serif); font-size: 22px; line-height: 1.5; margin: 0 0 calc(24px * var(--sp)); letter-spacing: .08em; }
.s-menu { margin: 0; max-width: 560px; }
.s-menu .row { display: flex; align-items: baseline; gap: 12px; font-weight: 600; }
.s-menu .row::after { content: ""; order: 1; flex: 1; border-bottom: 1px dotted var(--c-sub); transform: translateY(-4px); }
.s-menu .price { order: 2; font-family: var(--c-serif); }
.s-menu dd { margin: calc(4px * var(--sp)) 0 calc(22px * var(--sp)); color: var(--c-sub); font-size: 14px; }
.s-menu dd:last-child { margin-bottom: 0; }
.s-about p { margin: 0; max-width: 34em; }
.s-news { list-style: none; margin: 0; padding: 0; max-width: 560px; }
.s-news li { display: grid; grid-template-columns: 6em 1fr; gap: 12px; padding: calc(12px * var(--sp)) 0; border-bottom: 1px solid var(--c-line); }
.s-news li:first-child { padding-top: 0; }
.s-news time { color: var(--c-sub); font-size: 14px; }
.s-info { display: grid; grid-template-columns: 7em 1fr; gap: calc(10px * var(--sp)) calc(16px * var(--sp)); margin: 0; max-width: 560px; }
.s-info dt { color: var(--c-sub); font-size: 14px; }
.s-info dd { margin: 0; }
/* 「セクション」の触る用：見出しと区切りをなくして、まとまりをわからなくする */
.site.flat .s-section { border-top: 0; padding-block: calc(6px * var(--sp)); }
.site.flat .s-section h2 { display: none; }

/* カルーセル */
.s-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; border: 1px solid var(--c-line); border-radius: 4px; background: var(--c-paper); }
.s-track::-webkit-scrollbar { display: none; }
.s-slide { flex: 0 0 100%; scroll-snap-align: start; display: grid; grid-template-columns: 150px 1fr; align-items: center; gap: 24px; padding: 24px 28px; }
.s-slide svg { width: 100%; }
.s-slide h3 { font-family: var(--c-serif); font-size: 19px; margin: 0 0 6px; }
.s-slide p { margin: 0; color: var(--c-sub); font-size: 14px; }
.s-car-ctrl { display: flex; align-items: center; gap: 14px; margin-top: 14px; }
.s-arrow { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid var(--c-sub); border-radius: 50%; background: none; color: var(--c-ink); font-size: 18px; line-height: 1; padding: 0; }
.s-dots { display: flex; gap: 8px; }
.s-dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--c-accent); background: none; padding: 0; }
.s-dot[aria-current="true"] { background: var(--c-accent); }

/* ページの見出し（トップ以外） */
.s-pagehead { padding: calc(40px * var(--sp)) calc(32px * var(--sp)) calc(8px * var(--sp)); }
.s-pagehead h1 { font-family: var(--c-serif); font-size: 28px; margin: 0 0 6px; letter-spacing: .06em; }
.s-pagehead p { margin: 0; color: var(--c-sub); font-size: 14px; }

/* タブ */
.s-tabs { display: flex; margin: calc(16px * var(--sp)) calc(32px * var(--sp)) 0; border-bottom: 1px solid var(--c-line); }
.s-tabs button { padding: 10px 18px; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; color: var(--c-sub); font: inherit; font-size: 14px; }
.s-tabs button[aria-selected="true"] { color: var(--c-ink); border-bottom-color: var(--c-accent); font-weight: 600; }

/* カードのグリッド */
.s-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  /* カードどうしの間は、カードのマージン（--cm）でつくる。外まわりは、そのぶん内側の余白を減らす */
  padding: max(0px, calc(24px * var(--sp) - var(--cm))) max(0px, calc(32px * var(--sp) - var(--cm))) max(0px, calc(56px * var(--sp) - var(--cm)));
}
.s-card { display: block; margin: var(--cm); background: var(--c-paper); border: 1px solid var(--c-line); border-radius: 4px; overflow: hidden; }
.s-card .art { display: grid; place-items: center; aspect-ratio: 4 / 3; background: #efe2cb; }
.s-card .art svg { width: 70%; }
.s-card .body { padding: var(--cp); }
/* 「カード」の触る用：枠と背景をなくす */
.site.plain .s-card { border-color: transparent; background: none; }
.site.plain .s-card .art { background: none; }
.s-card .name { font-weight: 600; }
.s-card .name span { display: block; font-family: var(--c-serif); font-weight: 400; font-size: 14px; }
.s-card p { margin: 4px 0 0; font-size: 13px; color: var(--c-sub); line-height: 1.7; word-break: normal; }   /* 幅がせまいので、文節ではなくふつうに折り返す */

/* 商品のページ */
.s-crumbs { padding: calc(20px * var(--sp)) calc(32px * var(--sp)) 8px; font-size: 13px; color: var(--c-sub); }
.s-crumbs ol { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
.s-crumbs li + li::before { content: "›"; margin-right: 8px; }
.s-crumbs a { border-bottom: 1px solid currentColor; }
.s-item { display: grid; grid-template-columns: 1fr 1fr; gap: calc(32px * var(--sp)); align-items: start; padding: calc(24px * var(--sp)) calc(32px * var(--sp)) calc(56px * var(--sp)); }
.s-photo { display: grid; place-items: center; width: 100%; aspect-ratio: 4 / 3; border: 0; border-radius: 4px; background: #efe2cb; padding: 0; cursor: zoom-in !important; }
.s-photo svg { width: 65%; }
.s-photo-note { font-size: 12px; color: var(--c-sub); margin: 6px 0 0; }
.s-item h1 { font-family: var(--c-serif); font-size: 26px; margin: 0 0 4px; }
.s-item .price { font-family: var(--c-serif); font-size: 18px; margin: 0 0 16px; }
.s-item p { margin: 0 0 20px; }

/* 予約フォーム */
.s-form { display: grid; gap: calc(18px * var(--sp)); max-width: 520px; }
.s-field > label, .s-field > .legend { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
.s-req { color: var(--c-err); font-size: 12px; font-weight: 400; margin-left: 6px; }
.s-form input[type="text"], .s-form input[type="date"], .s-form select, .s-form textarea {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid #cdb99a;
  border-radius: 3px;
  background: #fffdf8;
  color: var(--c-ink);
  font: inherit;
}
.s-form textarea { min-height: 5em; resize: vertical; }
.s-form :focus-visible { outline: 2px solid var(--c-accent); outline-offset: 1px; }
.s-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.s-radios { display: flex; gap: 22px; }
.s-radios label { display: flex; align-items: center; gap: 6px; }
.s-radios input { accent-color: var(--c-accent); }
.s-field.err input { border-color: var(--c-err); }
.s-err { color: var(--c-err); font-size: 13px; margin: 4px 0 0; }
.s-done { padding: 20px 22px; border: 1px solid var(--c-accent); border-radius: 4px; background: var(--c-paper); max-width: 520px; }
.s-done p { margin: 0 0 10px; }
.s-done .note { color: var(--c-sub); font-size: 14px; }

/* よくある質問（アコーディオン） */
.s-faq { max-width: 560px; border-top: 1px solid var(--c-line); }
.s-faq details { border-bottom: 1px solid var(--c-line); }
.s-faq summary { display: flex; justify-content: space-between; gap: 16px; padding: 14px 2px; font-weight: 600; cursor: pointer; list-style: none; }
.s-faq summary::-webkit-details-marker { display: none; }
.s-faq summary::after { content: "＋"; color: var(--c-accent); font-weight: 400; }
.s-faq details[open] summary::after { content: "－"; }
.s-faq p { margin: 0 0 16px; padding: 0 2px; color: var(--c-sub); }

/* モーダルとドロワー（見本の画面の上に重なる層） */
.s-layer { position: absolute; left: 0; right: 0; z-index: 5; overflow: hidden; }
.s-backdrop { position: absolute; inset: 0; background: rgba(40, 28, 20, .55); }
.s-modal {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: min(420px, calc(100% - 40px));
  padding: 18px 18px 20px;
  border-radius: 6px;
  background: var(--c-paper);
  box-shadow: 0 12px 32px rgba(0, 0, 0, .28);   /* 後ろのページから浮いて見せる */
}
.s-modal .art { display: grid; place-items: center; aspect-ratio: 4 / 3; background: #efe2cb; border-radius: 4px; }
.s-modal .art svg { width: 70%; }
.s-modal p { margin: 10px 0 0; font-family: var(--c-serif); font-size: 17px; }
.s-close { position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--c-paper); color: var(--c-ink); padding: 0; }
.s-drawer {
  position: absolute;
  top: 0; right: 0; bottom: 0;
  width: min(280px, 82%);
  padding: 12px 20px;
  background: var(--c-paper);
  box-shadow: -8px 0 24px rgba(0, 0, 0, .2);
}
.s-drawer .s-close { position: static; margin-left: auto; }
.s-drawer ul { list-style: none; margin: 8px 0 0; padding: 0; }
.s-drawer a { display: block; padding: 14px 2px; border-bottom: 1px solid var(--c-line); font-size: 15px; }

.s-footer { padding: calc(32px * var(--sp)) calc(32px * var(--sp)) calc(24px * var(--sp)); background: #3b2a1f; color: #e9dcc6; font-size: 13px; }
.s-footer p { margin: 0; }
.s-foot-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 16px 32px; padding-bottom: calc(20px * var(--sp)); margin-bottom: calc(16px * var(--sp)); border-bottom: 1px solid #5a4636; }
.s-foot-name { font-family: var(--c-serif); font-size: 16px; font-weight: 700; letter-spacing: .06em; margin-bottom: 4px !important; }
.s-foot-nav ul { display: flex; flex-wrap: wrap; gap: 6px 20px; margin: 0; padding: 0; list-style: none; }
.s-foot-nav a { border-bottom: 1px solid transparent; }
.s-foot-note { margin-top: 4px !important; color: #bfae95; }

/* ホバー：マウスを乗せたときの変化。.hov は「見る」で、乗せたときの様子を見せる用 */
.s-btn, .s-arrow, .s-sublink, .s-nav a, .s-card, .s-foot-nav a { transition: background-color .15s, color .15s, border-color .15s; }
.s-nav a.hov { border-bottom-color: var(--c-accent); }
.s-btn.hov { background: #6a3c1a; }
.s-arrow.hov { background: var(--c-accent); border-color: var(--c-accent); color: #fbf6ec; }
.s-sublink.hov { color: var(--c-accent); }
.s-card.hov { border-color: var(--c-accent); }
@media (hover: hover) {   /* 指で触る画面では、色が残らないようにする */
  .site:not(.no-hover) .s-nav a:hover { border-bottom-color: var(--c-accent); }
  .site:not(.no-hover):not(.cta-weak) .s-btn:hover { background: #6a3c1a; }
  .site:not(.no-hover) .s-arrow:hover { background: var(--c-accent); border-color: var(--c-accent); color: #fbf6ec; }
  .site:not(.no-hover) .s-sublink:hover { color: var(--c-accent); }
  .site:not(.no-hover) .s-card:hover { border-color: var(--c-accent); }
  .site:not(.no-hover) .s-foot-nav a:hover { border-bottom-color: currentColor; }
}

/* スクロールアニメーション：まとまりが見えてきたら現れる（その用語のときだけ） */
.site.anim [data-reveal] { opacity: 0; transform: translateY(32px); transition: opacity var(--ad, .6s) ease-out, transform var(--ad, .6s) ease-out; }
.site.anim.side [data-reveal] { transform: translateX(-40px); }
.site.anim [data-reveal].shown { opacity: 1; transform: none; }

/* OGP：メッセージのアプリで、ページが共有された場面（お店のサイトとは別の見た目） */
.site.sharing { background: #eceff1; }
.site.sharing .s-header, .site.sharing .s-footer { display: none; }
.s-sns { max-width: 480px; margin: 0 auto; padding-bottom: 48px; color: #222; line-height: 1.6; }
.s-sns-head { margin: 0; padding: 14px 20px; background: #fff; border-bottom: 1px solid #d9dde1; font-weight: 700; font-size: 15px; text-align: center; }
.s-msg { display: flex; gap: 10px; padding: 20px 16px 0; }
.s-avatar { flex: none; width: 36px; height: 36px; border-radius: 50%; background: #8fa9ba; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.s-who { font-size: 12px; color: #5b6670; margin: 0 0 4px; }
.s-bubble { background: #fff; border-radius: 4px 14px 14px 14px; padding: 10px 12px 12px; max-width: 340px; font-size: 14px; }
.s-bubble > p { margin: 0 0 4px; }
.s-url { color: #2a62b0; font-size: 13px; word-break: break-all; }
.s-ogp { display: block; margin-top: 8px; border: 1px solid #d9dde1; border-radius: 10px; overflow: hidden; background: #fff; }
.s-ogp-img svg { display: block; width: 100%; height: auto; }
.s-ogp-body { padding: 8px 12px 10px; }
.s-ogp-site { font-size: 12px; color: #5b6670; margin: 0; }
.s-ogp-title, .s-ogp-desc { margin: 0; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.s-ogp-title { font-weight: 700; font-size: 14px; }
.s-ogp-desc { font-size: 13px; color: #5b6670; }

/* 見本サイト自身のレスポンシブ（見本の枠の幅で切り替わる） */
@container (max-width: 620px) {
  .s-header { flex-direction: column; align-items: flex-start; padding: calc(14px * var(--sp)) calc(20px * var(--sp)); gap: 8px; }
  .s-nav ul { gap: 6px calc(16px * var(--sp)); flex-wrap: wrap; }
  .s-hero { grid-template-columns: 1fr; padding: calc(36px * var(--sp)) calc(20px * var(--sp)) calc(44px * var(--sp)); gap: calc(20px * var(--sp)); }
  .s-hero h1 { font-size: 26px; }
  .s-hero > svg { max-width: 140px; justify-self: start; grid-row: 1; }
  .s-section { padding: calc(40px * var(--sp)) calc(20px * var(--sp)); }
  .s-news li { grid-template-columns: 1fr; gap: 0; }
  .s-slide { grid-template-columns: 90px 1fr; gap: 16px; padding: 18px; }
  .s-pagehead { padding: calc(28px * var(--sp)) calc(20px * var(--sp)) calc(6px * var(--sp)); }
  .s-tabs { margin: calc(12px * var(--sp)) calc(20px * var(--sp)) 0; }
  .s-tabs button { padding: 10px 12px; }
  .s-grid { grid-template-columns: 1fr 1fr; padding: max(0px, calc(20px * var(--sp) - var(--cm))) max(0px, calc(20px * var(--sp) - var(--cm))) max(0px, calc(40px * var(--sp) - var(--cm))); }
  .s-card p { display: none; }
  .s-crumbs { padding: calc(16px * var(--sp)) calc(20px * var(--sp)) 8px; }
  .s-item { grid-template-columns: 1fr; padding: calc(18px * var(--sp)) calc(20px * var(--sp)) calc(40px * var(--sp)); }
  .s-row2 { grid-template-columns: 1fr; }
  .s-footer { padding: calc(24px * var(--sp)) calc(20px * var(--sp)); }
  .s-foot-top { flex-direction: column; }
}
</style>
</head>
<body>

<header class="bar">
  <div class="brand"><span data-t="app.name"></span><small data-t="app.note"></small></div>
  <button type="button" class="bar-btn" id="open-list" aria-haspopup="dialog">
    <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
    <span data-t="app.list"></span>
  </button>
  <div class="bar-right">
    <span class="progress" id="bar-progress"></span>
    <button type="button" class="bar-btn" id="prev" data-t="app.prev"></button>
    <button type="button" class="bar-btn" id="next" data-t="app.next"></button>
  </div>
</header>

<dialog class="list" id="list" aria-labelledby="list-title">
  <div class="list-head">
    <h2 id="list-title" data-t="app.list"></h2>
    <span class="progress" id="list-progress"></span>
    <button type="button" class="bar-btn" id="close-list" data-t="app.close"></button>
  </div>
  <div class="list-body" id="list-body"></div>
</dialog>

<div class="layout">
  <section class="stage" aria-labelledby="stage-label">
    <span id="stage-label" hidden data-t="app.stageLabel"></span>
    <div class="browser">
      <div class="b-tabs" id="b-tabs" hidden></div>
      <div class="browser-bar" aria-hidden="true">
        <span class="dots"><i></i><i></i><i></i></span>
        <span class="url" id="url"></span>
      </div>
      <div class="b-marks" id="b-marks" aria-hidden="true" hidden></div>
      <div class="viewport" id="viewport">

        <!-- ここから見本のサイト -->
        <div class="site" id="site">
          <header class="s-header" data-part="header">
            <a href="#" class="s-logo" data-part="logo" data-go="home">
              <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
                <circle cx="14" cy="14" r="13" fill="#f1dcb4"/>
                <path d="M8 13h10v3a5 5 0 0 1-10 0z" fill="#8a5226"/>
                <path d="M18 14h1.5a2 2 0 0 1 0 4H18" fill="none" stroke="#8a5226" stroke-width="1.5"/>
              </svg>
              <span data-t="site.name"></span>
            </a>
            <nav class="s-nav" data-part="nav">
              <ul>
                <li><a href="#" data-go="menu" data-t="site.nav.menu"></a></li>
                <li><a href="#" data-go="home#about" data-t="site.nav.about"></a></li>
                <li><a href="#" data-go="home#info" data-t="site.nav.access"></a></li>
                <li><a href="#" data-go="home#news" data-t="site.nav.news"></a></li>
                <li><a href="#" data-go="reserve" data-t="site.nav.reserve"></a></li>
              </ul>
            </nav>
            <button type="button" class="s-burger" data-part="burger" id="s-burger" aria-controls="s-layer"><span></span></button>
          </header>

          <main>
            <!-- トップページ -->
            <div data-page="home">
              <section class="s-hero" data-part="hero">
                <div>
                  <h1 data-part="catch" data-t="site.hero.title"></h1>
                  <p data-part="heroText" data-t="site.hero.body"></p>
                  <div class="s-hero-actions">
                    <a href="#" class="s-btn" data-part="cta" data-go="reserve" data-t="site.hero.button"></a>
                    <a href="#" class="s-sublink" data-part="sublink" data-go="menu" data-t="site.hero.sub"></a>
                  </div>
                </div>
                <svg viewBox="0 0 240 200" aria-hidden="true" data-part="visual">
                  <circle cx="150" cy="78" r="62" fill="#f1dcb4"/>
                  <path d="M96 40c-8 10 8 16 0 28M118 34c-8 10 8 16 0 28M140 40c-8 10 8 16 0 28" fill="none" stroke="#b9a283" stroke-width="3" stroke-linecap="round"/>
                  <ellipse cx="118" cy="170" rx="86" ry="14" fill="#e2d3bb"/>
                  <path d="M62 86h112v34c0 30-25 52-56 52s-56-22-56-52z" fill="#fbf6ec" stroke="#3b2a1f" stroke-width="3"/>
                  <path d="M174 98h10a18 18 0 0 1 0 36h-14" fill="none" stroke="#3b2a1f" stroke-width="3"/>
                  <ellipse cx="118" cy="86" rx="56" ry="9" fill="#6b3d1c" stroke="#3b2a1f" stroke-width="3"/>
                </svg>
              </section>

              <section class="s-section" data-part="carousel" aria-roledescription="carousel">
                <h2 data-t="site.carousel.title"></h2>
                <div class="s-track" id="s-track" data-part="slides"></div>
                <div class="s-car-ctrl">
                  <button type="button" class="s-arrow" data-part="arrows" id="s-prev">‹</button>
                  <button type="button" class="s-arrow" data-part="arrows" id="s-next">›</button>
                  <div class="s-dots" data-part="dots" id="s-dots"></div>
                </div>
              </section>

              <section class="s-section" data-part="menu">
                <h2 data-t="site.menu.title"></h2>
                <dl class="s-menu" id="s-menu"></dl>
              </section>

              <section class="s-section s-about" data-part="about">
                <h2 data-t="site.about.title"></h2>
                <p id="s-about-text" data-t="site.about.body"></p>
              </section>

              <section class="s-section" data-part="info">
                <h2 data-t="site.info.title"></h2>
                <dl class="s-info" id="s-info"></dl>
              </section>

              <section class="s-section" data-part="news">
                <h2 data-t="site.news.title"></h2>
                <ul class="s-news" id="s-news"></ul>
              </section>
            </div>

            <!-- メニュー一覧のページ -->
            <div data-page="menu" hidden>
              <nav class="s-crumbs" data-part="breadcrumb" data-crumbs="menu"></nav>
              <div class="s-pagehead" data-part="pagehead">
                <h1 data-t="site.menuPage.title"></h1>
                <p data-t="site.menuPage.lead"></p>
              </div>
              <div class="s-tabs" role="tablist" data-part="tabs" id="s-tabs"></div>
              <div class="s-grid" role="tabpanel" data-part="tabpanel" id="s-grid"></div>
            </div>

            <!-- 商品のページ -->
            <div data-page="item" hidden>
              <nav class="s-crumbs" data-part="breadcrumb" data-crumbs="item"></nav>
              <div class="s-item" id="s-item"></div>
            </div>

            <!-- 予約のページ -->
            <div data-page="reserve" hidden>
              <nav class="s-crumbs" data-part="breadcrumb" data-crumbs="reserve"></nav>
              <div class="s-pagehead" data-part="pagehead">
                <h1 data-t="site.reserve.title"></h1>
                <p data-t="site.reserve.lead"></p>
              </div>
              <section class="s-section" style="border-top: 0" data-part="form">
                <div id="s-form-wrap"></div>
              </section>
              <section class="s-section" data-part="faq">
                <h2 data-t="site.reserve.faqTitle"></h2>
                <div class="s-faq" id="s-faq"></div>
              </section>
            </div>

            <!-- OGP の用語で使う、ページが共有された場面 -->
            <div data-page="share" hidden>
              <div class="s-sns" id="s-sns"></div>
            </div>
          </main>

          <footer class="s-footer" data-part="footer">
            <div class="s-foot-top">
              <div data-part="shopInfo">
                <p class="s-foot-name" data-t="site.name"></p>
                <p data-t="site.footer.address"></p>
                <p data-t="site.footer.hours"></p>
              </div>
              <nav class="s-foot-nav" data-part="footerNav">
                <ul>
                  <li><a href="#" data-go="menu" data-t="site.nav.menu"></a></li>
                  <li><a href="#" data-go="home#about" data-t="site.nav.about"></a></li>
                  <li><a href="#" data-go="home#info" data-t="site.nav.access"></a></li>
                  <li><a href="#" data-go="reserve" data-t="site.nav.reserve"></a></li>
                </ul>
              </nav>
            </div>
            <p data-part="copyright" data-t="site.footer.copy"></p>
            <p class="s-foot-note" data-t="site.footer.note"></p>
          </footer>

          <!-- モーダルとドロワーの層 -->
          <div class="s-layer" id="s-layer" hidden>
            <div class="s-backdrop" data-part="backdrop" id="s-backdrop"></div>
            <div class="s-modal" role="dialog" aria-modal="true" data-part="modal" id="s-modal" hidden></div>
            <div class="s-drawer" role="dialog" aria-modal="true" data-part="drawer" id="s-drawer" hidden></div>
          </div>

          <svg class="overlay" id="overlay" aria-hidden="true"></svg>
        </div>
        <!-- 見本のサイトここまで -->

      </div>
    </div>
  </section>

  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>

<script>
/* ============================================================
   画面に出る文章は、すべてここにまとめる。
   英語を足すときは、ja と同じ形で en を並べる。
   ============================================================ */
const TEXT = {
  ja: {
    app: {
      name: 'Touch Terms',
      note: '試作版',
      stageLabel: '見本のサイト',
      list: '用語一覧',
      close: '閉じる',
      prev: '前へ',
      next: '次へ',
      progress: '{done} / {total} 済',
      soon: '準備中',
      done: '済',
      doneLabel: '学習済み',
      count: '{chapter} ・ {n} / {total}',
      chapters: {
        structure: '1章 ページの骨組み',
        layout: '2章 並べ方',
        parts: '3章 部品',
        motion: '4章 動き',
        outside: '5章 ページの外側',
      },

/* ---- スクロールアニメーション：見えてきたまとまりに .shown をつける ---- */
// 見本の枠の下から入ってきたら現れ、下へ出ていったら元に戻す（上へ戻ってスクロールし直すと、また現れる）
// 12% 見えたら現れる。まったく見えなくなった（0）ときに、下にあれば戻す
const revealer = new IntersectionObserver((entries) => {
  for (const e of entries) {
    if (e.intersectionRatio >= 0.12) e.target.classList.add('shown');
    else if (!e.isIntersecting && e.rootBounds && e.boundingClientRect.top >= e.rootBounds.bottom - 1) e.target.classList.remove('shown');
  }
}, { root: vp, threshold: [0, 0.12] });

  site.classList.toggle('sharing', page === 'share');
  if (page === 'menu') setTab(state.tab);
  if (page === 'item') buildItem();
  if (page === 'share') renderOgp();
  buildCrumbs();
  if (!keepScroll) vp.scrollTop = 0;

/* ============================================================

/* 囲み＋引き出し線＋名前 */
function annotate(el, label, { dashed = false } = {}) {
  if (!el || el.closest('[hidden]')) return [];
  const b = boxOf(el);
  if (!b.w || !b.h) return [];
  const W = site.offsetWidth;
  const H = site.offsetHeight;
  const out = [svg('rect', {
    x: b.x + 3, y: b.y + 3, width: Math.max(0, b.w - 6), height: Math.max(0, b.h - 6),
    fill: 'none', stroke: PEN, 'stroke-width': dashed ? 1.5 : 2.5,
    'stroke-dasharray': dashed ? '6 4' : 'none', rx: 2,
  })];
  // 実線（主役）の名前は左、点線（補足）の名前は右に書いて、重ならないようにする
  const textW = label.length * 14;
  const right = dashed || b.x + 18 + textW + 12 > W;
  const lx = right ? b.x + b.w - 18 : b.x + 18;
  // 名前は、いま見えている範囲に収まる側に書く（下 → 上 → 枠の内側の順に試す）
  const seenTop = vp.scrollTop;
  const seenBottom = Math.min(H, vp.scrollTop + vp.clientHeight);
  if (b.y + b.h < seenTop || b.y > seenBottom) return out;  // 見えていない場所には名前を書かない
  const len = dashed ? 30 : 18;
  let where = 'inside';
  if (b.y + b.h + len + 16 < seenBottom && b.y + b.h > seenTop) where = 'below';
  else if (b.y - len - 16 > seenTop && b.y < seenBottom) where = 'above';
  const tx = right ? lx - 6 : lx + 6;
  const anchor = right ? 'end' : 'start';
  if (where === 'inside') {
    out.push(svg('text', { x: tx, y: Math.max(b.y, seenTop) + 12, 'text-anchor': anchor, 'dominant-baseline': 'hanging' }, label));
    return out;
  }
  const below = where === 'below';
  const y0 = below ? b.y + b.h - 3 : b.y + 3;
  const y1 = below ? y0 + len : y0 - len;
  out.push(
    svg('circle', { cx: lx, cy: y0, r: 3, fill: PEN }),
    svg('path', { d: `M${lx} ${y0} L${lx} ${y1}`, fill: 'none', stroke: PEN, 'stroke-width': 1.5 }),
    svg('text', { x: tx, y: below ? y1 + 5 : y1 + 1, 'text-anchor': anchor, 'dominant-baseline': below ? 'hanging' : 'auto' }, label),
  );
  return out;
}

/* 正解の赤丸（要素を囲む／点を囲む） */
function circle(el, label) {
  if (!el) return [];
  const b = boxOf(el);
  return loop(b.x + b.w / 2, b.y + b.h / 2, Math.max(20, b.w / 2 - 6), Math.max(14, b.h / 2 + 2), label, b.x + 6, b.y + b.h + 10);
}

}
function loop(cx, cy, rx, ry, label, lx, ly) {

  const start = Math.PI * 1.1;
  const pts = [];
  for (let i = 0; i <= 80; i++) {
    const a = start + (Math.PI * 2.12 * i) / 80;
    const k = 1 + 0.02 * Math.sin(a * 3) - 0.08 * (i / 80);
    pts.push(`${(cx + rx * k * Math.cos(a)).toFixed(1)} ${(cy + ry * k * Math.sin(a)).toFixed(1)}`);
  }
  return [
    svg('path', { d: `M${pts.join(' L')}`, fill: 'none', stroke: PEN, 'stroke-width': 2.5, 'stroke-linecap': 'round' }),
    svg('text', { x: lx, y: ly, 'dominant-baseline': 'hanging' }, label),
  ];
}
function cross(x, y) {
  const s = 8;
  return [svg('path', {
    d: `M${x - s} ${y - s} L${x + s} ${y + s} M${x + s} ${y - s} L${x - s} ${y + s}`,
    stroke: PEN, 'stroke-width': 2.5, 'stroke-linecap': 'round',

}

/* ファーストビューの境目（折り目）。下側は薄く塗る */
const foldY = () => vp.clientHeight;
function fold(label) {
  const y = foldY();

    svg('path', { d: `M0 ${y} L${W} ${y}`, stroke: PEN, 'stroke-width': 2.5 }),
    svg('rect', { x: W - 12 - tagW, y: y - 22, width: tagW, height: 22, fill: PEN, rx: 2 }),
    svg('text', { x: W - 12 - tagW / 2, y: y - 11, 'text-anchor': 'middle', 'dominant-baseline': 'central', class: 'tag' }, label),

}

/* 余白に斜線と大きさを書く */
function hatch(x, y, w, hgt) {
  const n = Math.max(0, Math.round(hgt));
  return [
    svg('rect', { x, y, width: Math.max(0, w), height: Math.max(0, hgt), fill: 'url(#hatch)' }),

function gaps() {

/* 行の区切り線 */
function rules() {

/* 赤い札（白い文字） */
function tagAt(x, y, label) {

    svg('rect', { x, y, width: w, height: 22, fill: PEN, rx: 2 }),

/* ---- カードの枠・マージン・パディング（メニューのページ） ---- */
const cards = () => [...site.querySelectorAll('#s-grid .s-card')];
const rectPath = (r) => `M${r.x} ${r.y}h${r.w}v${r.h}h${-r.w}z`;
const within = (r, x, y) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;

  const cs = getComputedStyle(el);
  return ['Top', 'Right', 'Bottom', 'Left'].map((k) => parseFloat(cs[prop + k]) || 0);
};
// 枠（border）・マージンを含めた外側・文字の入れ物・文字の入る範囲
function cardBoxes(card) {
  const border = boxOf(card);
  const [mt, mr, mb, ml] = sides(card, 'margin');
  const body = $('.body', card);
  const bb = boxOf(body);
  const [pt, pr, pb, pl] = sides(body, 'padding');
  return {
    border,
    outer: { x: border.x - ml, y: border.y - mt, w: border.w + ml + mr, h: border.h + mt + mb },
    body: bb,
    content: { x: bb.x + pl, y: bb.y + pt, w: bb.w - pl - pr, h: bb.h - pt - pb },
  };
}
// 外側の四角から内側の四角を抜いた部分に斜線を引く
const hatchRing = (outer, inner) => svg('path', { d: rectPath(outer) + rectPath(inner), fill: 'url(#hatch)', 'fill-rule': 'evenodd' });

function labelCard() {
  const list = cards();
  const bottom = Math.max(...list.map((c) => boxOf(c).y));
  return list.filter((c) => Math.abs(boxOf(c).y - bottom) < 2).sort((a, b) => boxOf(a).x - boxOf(b).x)[0];
}

  const out = cards().map((c) => { const z = cardBoxes(c); return hatchRing(z.outer, z.border); });
  const c = labelCard();
  if (c) {
    const z = cardBoxes(c);
    out.push(...tagAt(z.outer.x, z.outer.y + z.outer.h + 4, t('terms.margin.tag', { n: state.cm })));
  }
  return out;
}
function paddingMarks() {
  const out = cards().map((c) => { const z = cardBoxes(c); return hatchRing(z.body, z.content); });
  const c = labelCard();
  if (c) {
    const z = cardBoxes(c);
    out.push(...tagAt(z.border.x, z.border.y + z.border.h + 6, t('terms.padding.tag', { n: state.cp })));
  }
  return out;
}
// クリックした場所が、カードのどこか（マージン・パディング・中身・写真・外）
function zoneAt(x, y) {
  for (const card of cards()) {
    const z = cardBoxes(card);
    if (within(z.border, x, y)) return { card, zone: !within(z.body, x, y) ? 'art' : within(z.content, x, y) ? 'inside' : 'padding' };
    if (within(z.outer, x, y)) return { card, zone: 'margin' };
  }
  return { zone: 'outside' };
}
const boxQuiz = (want) => ({
  inSample: true,
  judge(el, x, y) {
    const { zone } = zoneAt(x, y);
    return { correct: zone === want, msg: zone === want ? 'correct' : zone, name: el.dataset.part };
  },
  marks(a) {
    if (!a.correct) return cross(a.x, a.y);
    const { card } = zoneAt(a.x, a.y);
    const z = card ? cardBoxes(card) : null;
    return [...(z ? [want === 'margin' ? hatchRing(z.outer, z.border) : hatchRing(z.body, z.content)] : []), ...ring(a.x, a.y, t('app.ok'))];

/* ---- グリッドの列 ---- */
function columns() {
  const cols = [];
  for (const c of cards()) {
    const b = boxOf(c);
    if (!cols.some((k) => Math.abs(k.x - b.x) < 2)) cols.push({ x: b.x, w: b.w });

    svg('path', { d: `M${k.x} ${top - 8}V${bottom + 8}M${k.x + k.w} ${top - 8}V${bottom + 8}`, stroke: PEN, 'stroke-width': 1.5, 'stroke-dasharray': '6 4' }),
    ...tagAt(k.x, bottom + 12, t('terms.grid.colTag', { n: i + 1 })),

/* ---- 見本の幅（レスポンシブ） ---- */
const BREAK = 620;

function widthText() {

const canWiden = () => state.wMax >= 700;

/* トップページのセクションを、ひとつずつ囲んで番号の札をつける */
function sectionBoxes() {
  return [...site.querySelectorAll('[data-page="home"] .s-section')].flatMap((sec, i) => {
    const b = boxOf(sec);
    const label = t('terms.section.tag', { n: i + 1 });
    const tagW = label.length * 12 + 18;
    const tx = b.x + b.w - 8 - tagW;
    return [
      svg('rect', { x: b.x + 4, y: b.y + 4, width: Math.max(0, b.w - 8), height: Math.max(0, b.h - 8), fill: 'none', stroke: PEN, 'stroke-width': 2, rx: 2 }),
      svg('rect', { x: tx, y: b.y + 4, width: tagW, height: 22, fill: PEN, rx: 2 }),
      svg('text', { x: tx + tagW / 2, y: b.y + 15, 'text-anchor': 'middle', 'dominant-baseline': 'central', class: 'tag' }, label),
    ];
  });
}

   - check：「確かめる」。inSample なら見本をクリックして答える
   - on：見本で起きたこと（タブを押した、など）を受け取る
   ============================================================ */

  const name = el.dataset.part;
  if (el.closest(`[data-part="${target}"]`)) return { correct: true, msg: name === target ? 'correct' : 'correctSub', name };
  return { correct: false, msg: 'wrong', name };
};

        }
        if (state.step === 'check') {
          if (from === 'crumbs' && target === 'menu') setAnswer(true, 'correct');
          else if (from === 'crumbs') setAnswer(false, 'home');
          else setAnswer(false, 'other', { name: label });
        }
      },
    },
    touch: () => [
      h('p', {}, T('touch.p1')),
      eventLine(),
      state.page !== 'item' ? h('div', { class: 'actions' }, quietBtn(T('touch.back'), () => {
        go(`item:${state.item}`);
        state.event = null;
        renderPanel();
        draw();
      })) : null,
    ],
    touchMarks: () => annotate(part('breadcrumb'), t('parts.breadcrumb')),
    // 正解なら、移った先のパンくずリストの最後（いまいる「メニュー」）を丸で囲む
    check: { marks: (a) => (a.correct ? circle(part('breadcrumb')?.querySelector('[aria-current]'), t('app.ok')) : []) },
  },

  /* ===== 3章 部品 ===== */
  cta: {
    hoverNames: true,
    main: () => part('cta'),
    items: { cta: () => part('cta'), sublink: () => part('sublink') },
    lookMarks: () => annotate(part('cta'), t('parts.cta')),
    touch() {
      return [
        h('p', {}, T('touch.p1')),
        toggle(T('touch.switch'), state.ctaWeak, (v) => { state.ctaWeak = v; }),
        state.ctaWeak ? h('p', {}, T('touch.after')) : null,
      ];
    },
    touchMarks: () => annotate(part('cta'), t('parts.cta')),
    check: {
      inSample: true,
      judge(el) {
        const name = el.dataset.part;
        if (el.closest('[data-part="cta"]')) return { correct: true, msg: 'correct', name };
        if (name === 'sublink') return { correct: false, msg: 'sub', name };
        return { correct: false, msg: 'wrong', name };
      },
      marks: sampleMarks('cta'),
    },
  },

  form: {
    page: 'reserve',
    hoverNames: true,
    main: () => part('form'),
    items: Object.fromEntries(['textbox', 'select', 'radio', 'textarea', 'submit'].map((id) => [id, () => part(id)])),
    lookMarks: () => annotate($('.s-form'), t('parts.form')),
    on: {
      submit({ ok }) { state.event = T(ok ? 'touch.ok' : 'touch.error'); renderPanel(); },
      formReset() { state.event = null; renderPanel(); },
    },
    touch: () => [h('p', {}, T('touch.p1')), eventLine()],
    check: {
      inSample: true,
      judge(el) {
        const name = el.dataset.part;
        return { correct: name === 'select', msg: name === 'select' ? 'correct' : 'wrong', name };
      },
      marks: (a) => (a.correct ? circle(a.el, t('app.ok')) : [...annotate(a.el, t(`parts.${a.name}`), { dashed: true }), ...cross(a.x, a.y)]),
    },
  },

  tabs: {
    page: 'menu',
    items: { tabs: () => part('tabs'), tabpanel: () => part('tabpanel') },
    lookMarks: () => annotate(part('tabs'), t('parts.tabs')),
    on: {
      tab({ id, label }) {
        if (state.step === 'touch') { state.event = T('touch.switched', { name: label }); renderPanel(); }
        if (state.step === 'check') setAnswer(id === 'cake', id === 'cake' ? 'correct' : 'wrong', { name: label });
      },
    },
    touch: () => [h('p', {}, T('touch.p1')), eventLine()],
    touchMarks: () => annotate(part('tabs'), t('parts.tabs')),
    check: { marks: (a) => (a.correct ? circle($('#s-tabs [data-tab="cake"]'), t('app.ok')) : []) },
  },

  accordion: {
    page: 'reserve',
    focus: 'faq',
    items: { faq: () => $('.s-faq'), summary: () => $('.s-faq summary') },
    lookMarks: () => annotate($('.s-faq'), t('parts.accordion')),
    on: {
      faq({ id, q, open }) {
        if (state.step === 'touch') { state.event = T(open ? 'touch.opened' : 'touch.closed'); renderPanel(); draw(); }
        if (state.step === 'check' && open) setAnswer(id === 'parking', id === 'parking' ? 'correct' : 'wrong', { name: q });
      },
    },
    touch: () => [h('p', {}, T('touch.p1')), eventLine()],
    check: { marks: (a) => (a.correct ? circle($('.s-faq [data-faq="parking"]'), t('app.ok')) : []) },
  },

  carousel: {
    focus: 'carousel',
    items: { slides: () => part('slides'), arrows: () => $('.s-car-ctrl'), dots: () => part('dots') },
    lookMarks: () => annotate(part('carousel'), t('parts.carousel')),
    on: {
      slide({ i }) {
        const s = t('site.carousel.slides')[i];
        if (state.step === 'touch') { state.event = T('touch.now', { n: i + 1, title: s.title }); renderPanel(); }
        if (state.step === 'check') setAnswer(i === 2, i === 2 ? 'correct' : 'wrong', { name: i + 1 });
      },
    },
    touch: () => [h('p', {}, T('touch.p1')), eventLine()],
    check: { marks: (a) => (a.correct ? circle(part('slides'), t('app.ok')) : []) },
  },

  modal: {
    page: 'item',
    enter(step) { if (step === 'look') openLayer('modal'); },
    items: { modal: () => $('#s-modal'), backdrop: () => $('#s-backdrop'), close: () => $('#s-modal .s-close') },
    lookMarks: () => (state.layer === 'modal' ? annotate($('#s-modal'), t('parts.modal')) : annotate(part('photo'), t('parts.photo'))),
    on: {
      modal({ open, via }) {
        if (state.step === 'touch') {
          state.event = open ? T('touch.opened')
            : T({ close: 'touch.closedClose', backdrop: 'touch.closedBackdrop', esc: 'touch.closedEsc' }[via]);
          renderPanel();
        }
        if (state.step === 'check' && !open) setAnswer(via !== 'close', via !== 'close' ? 'correct' : 'wrong');
      },
    },
    touch: () => [h('p', {}, T('touch.p1')), eventLine()],
    touchMarks: () => (state.layer ? [] : annotate(part('photo'), t('parts.photo'))),
    check: { marks: () => [] },
  },

  drawer: {
    compact: true,
    frameWidth: 390,
    items: { burger: () => $('#s-burger'), drawer: () => $('#s-drawer') },
    pinMarks: false,
    // 「ドロワー」を押したら開いて見せ、「ハンバーガーメニュー」を押したら閉じて見せる
    onPin(id) {
      if (id === 'drawer') openLayer('drawer');
      else closeLayer('pin');
    },
    lookMarks: () => (state.layer === 'drawer'
      ? annotate($('#s-drawer'), t('parts.drawer'))
      : annotate($('#s-burger'), t('parts.burger'))),
    allowNav: (link) => state.step !== 'look' && !!link.closest('.s-drawer'),
    on: {
      drawer({ open }) {
        if (state.step === 'touch' && !state.navigating) { state.event = T(open ? 'touch.opened' : 'touch.closed'); renderPanel(); }
      },
      go({ target, label }) {
        if (state.step === 'touch') { state.event = T('touch.moved', { name: label }); renderPanel(); }
        if (state.step === 'check') setAnswer(target === 'home#info', target === 'home#info' ? 'correct' : 'wrong', { name: label });
      },
    },
    touch: () => [h('p', {}, T('touch.p1')), eventLine()],
    touchMarks: () => (state.layer ? [] : annotate($('#s-burger'), t('parts.burger'))),
    check: { marks: (a) => (a.correct ? circle(part('info'), t('app.ok')) : []) },
  },
};

/* 見本を下までスクロールする／上へ戻るボタン（固定ヘッダー） */
function scrollButtons() {
  return h('div', { class: 'actions' },
    quietBtn(T('down'), () => vp.scrollTo({ top: vp.scrollHeight, behavior: 'smooth' })),
    quietBtn(T('up'), () => vp.scrollTo({ top: 0, behavior: 'smooth' })));
}

/* スイッチ */
function toggle(label, checked, set) {
  return h('label', { class: 'switch' },
    h('input', {
      type: 'checkbox', role: 'switch', checked,
      on: { change: (e) => { set(e.target.checked); applySite(); renderPanel(); draw(); } },
    }),
    label);
}

/* つまみ（ラベル・いまの値・スライダー） */
function rangeRow({ label, min, max, step, value, format, onInput }) {
  const id = `range-${Math.random().toString(36).slice(2, 7)}`;
  const output = h('output', { for: id }, format(Number(value)));
  const input = h('input', {
    id, type: 'range', min, max, step, value,
    on: { input: (e) => { const v = Number(e.target.value); output.textContent = format(v); onInput(v); } },
  });
  return h('div', { class: 'range' }, h('label', { for: id }, label, output), input);
}
/* つまみ＋判定＋プリセットのボタン（余白・行間） */
function sliderLesson({ min, max, step, value, format, judge, apply, presets }) {
  const verdict = h('div', { class: 'verdict' });
  const update = (v) => {
    const [title, body] = T(`touch.${judge(v)}`);
    verdict.replaceChildren(h('p', {}, h('b', {}, title), body));
  };
  update(value);
  const row = rangeRow({
    label: T('touch.label'), min, max, step, value, format,
    onInput: (v) => { apply(v); applySite(); draw(); update(v); },
  });
  const set = (v) => { const input = $('input', row); input.value = v; input.dispatchEvent(new Event('input')); };
  return [
    h('p', {}, T('touch.p1')),
    row,
    verdict,
    h('div', { class: 'actions' }, presets.map(([label, v]) => h('button', { type: 'button', class: 'btn quiet', on: { click: () => set(v) } }, label))),
  ];
}

/* ============================================================
   アプリの画面を組み立てる
   ============================================================ */
const ready = (id) => !!LESSONS[id];
const readyTerms = () => TERMS.filter(ready);

function renderBar() {
  const list = readyTerms();
  const i = list.indexOf(state.term);
  $('#prev').disabled = i <= 0;
  $('#next').disabled = i >= list.length - 1;
  const done = TERMS.filter((id) => state.progress[id]).length;
  const text = t('app.progress', { done, total: TERMS.length });
  $('#bar-progress').textContent = text;
  $('#list-progress').textContent = text;
}

function renderList() {
  $('#list-body').replaceChildren(...CHAPTERS.map((c) => h('section', {},
    h('h3', {}, t(`app.chapters.${c.id}`)),
    h('ol', {}, c.terms.map((id) => h('li', {},
      h('button', {
        type: 'button',
        disabled: !ready(id),
        'aria-current': id === state.term ? 'page' : false,
        on: { click: () => { $('#list').close(); selectTerm(id); } },
      },
        h('span', { class: 'num' }, String(TERMS.indexOf(id) + 1).padStart(2, '0')),
        h('span', { class: 'name' }, t(`terms.${id}.name`)),
        !ready(id) ? h('span', { class: 'soon' }, t('app.soon'))
          : state.progress[id] ? h('span', { class: 'stamp', title: t('app.doneLabel'), 'aria-label': t('app.doneLabel') }, t('app.done')) : null)))))));
}

function renderPanel() {
  const lesson = L();
  const c = chapterOf(state.term);

  const tabs = h('div', { class: 'tabs', role: 'tablist' }, STEPS.map((s, i) => h('button', {
    type: 'button', role: 'tab',
    'aria-selected': String(s === state.step),
    on: { click: () => setStep(s) },
  }, h('span', { class: 'num' }, i + 1), t(`app.steps.${s}`))));

  const nextStep = STEPS[STEPS.indexOf(state.step) + 1];
  const nextBtn = nextStep
    ? h('div', { class: 'actions' }, h('button', { type: 'button', class: 'btn', on: { click: () => setStep(nextStep) } }, t('app.nextStep', { step: t(`app.steps.${nextStep}`) })))
    : null;

  let body;
  if (state.step === 'look') {
    const vars = lesson.lookVars ? lesson.lookVars() : undefined;
    const items = T('look.items');
    body = [
      h('p', {}, T('look.p1', vars)),
      h('p', {}, T('look.p2', vars)),
      Array.isArray(items) ? h('ul', { class: 'parts' }, items.map((it) => h('li', {},
        h('button', {
          type: 'button',
          'aria-pressed': String(state.pinned === it.id),
          on: { click: () => pin(it.id) },
        }, h('b', {}, it.label), h('span', {}, it.desc))))) : null,
      h('p', {}, T('look.p3', vars)),
      h('p', { class: 'sub' }, T('look.tip', vars)),
      lesson.lookExtra?.(),
      nextBtn,
    ];
  } else if (state.step === 'touch') {
    body = [...lesson.touch(), nextBtn];
  } else {
    body = renderCheck(lesson);
  }

  panel.replaceChildren(
    h('p', { class: 'count' }, t('app.count', { chapter: t(`app.chapters.${c.id}`), n: c.terms.indexOf(state.term) + 1, total: c.terms.length })),
    h('h1', { class: 'term-name' }, T('name')),
    h('p', { class: 'term-en', lang: 'en' }, T('en')),
    h('p', { class: 'lead' }, T('lead')),
    tabs,
    h('div', { class: 'step', role: 'tabpanel' }, body),
  );
}

function renderCheck(lesson) {
  const a = state.answer;
  const out = [h('p', {}, T('check.q'))];
  if (lesson.check.inSample) out.push(h('p', { class: 'sub' }, t('app.keys')));
  if (lesson.check.choices) {
    out.push(h('div', { class: 'choices' }, lesson.check.choices.map((c, i) => h('button', {
      type: 'button',
      'aria-pressed': String(!!a && a.choice === i),
      on: { click: () => choose(i) },
    }, h('span', { class: 'key' }, 'ABC'[i]), lesson.check.choice(c)))));
  }
  if (a) {
    out.push(h('div', { class: 'feedback' },
      h('p', {},
        h('span', { class: `label ${a.correct ? 'ok' : 'ng'}` }, t(a.correct ? 'app.ok' : 'app.ng')),
        T(`check.${a.msg}`, a.vars))));
    const list = readyTerms();
    const next = list[list.indexOf(state.term) + 1];
    const actions = h('div', { class: 'actions' });
    if (a.correct && next) actions.append(h('button', { type: 'button', class: 'btn', on: { click: () => selectTerm(next) } }, t('app.nextTerm', { name: t(`terms.${next}.name`) })));
    if (a.correct && !next && list.every((id) => state.progress[id])) out.push(h('p', { class: 'sub' }, t('app.allDone')));
    actions.append(h('button', { type: 'button', class: 'btn quiet', on: { click: () => setStep('check') } }, t('app.retry')));
    out.push(actions);
  }
  return out;
}

/* ---- 切り替え ---- */
function selectTerm(id) {
  if (!ready(id)) return;
  state.term = id;
  save(LAST_KEY, id);
  panel.scrollTop = 0;
  if (matchMedia('(max-width: 900px)').matches) window.scrollTo({ top: 0 });
  setStep('look');
}

function setStep(step) {
  const lesson = L();
  state.step = step;
  state.hover = null;
  state.pinned = null;
  state.answer = null;
  resetSample();
  applySite();
  setPage(lesson.page || 'home');
  if (step === 'touch' && state.term === 'fv') state.vpMax = vp.clientHeight;
  state.wMax = $('.browser').clientWidth;
  scrollStage(step === 'check' && !['lineHeight', 'accordion', 'carousel', 'margin', 'padding', 'grid'].includes(state.term) ? null : lesson.focus);
  lesson.enter?.(step);
  renderBar();
  renderList();
  renderPanel();
  draw();
}

function pin(id) {
  state.pinned = state.pinned === id ? null : id;
  L().onPin?.(state.pinned);
  const items = L().items;
  const el = state.pinned && items && items[id] ? items[id]() : null;
  if (el && !el.closest('.s-layer')) {
    // ページ全体は動かさず、見本の枠の中だけをスクロールする
    const b = boxOf(el);
    if (b.y < vp.scrollTop || b.y + b.h > vp.scrollTop + vp.clientHeight) {
      vp.scrollTo({ top: Math.max(0, b.y - 24), behavior: 'smooth' });
    }
  }
  renderPanel();
  draw();
}

/* ---- 確かめる：答え合わせ ---- */
function record(correct) {
  if (correct && !state.progress[state.term]) {
    state.progress[state.term] = true;
    save(STORE_KEY, state.progress);
    renderBar();
    renderList();
  }
}
function setAnswer(correct, msg, vars, extra = {}) {
  state.answer = { correct, msg, vars, ...extra };
  record(correct);
  renderPanel();
  draw();
}
function answer(target, x, y) {
  const el = target.closest('[data-part]');
  if (!el) return;
  const r = L().check.judge(el, x, y);
  setAnswer(r.correct, r.msg, { name: r.label ?? t(`parts.${r.name}`) }, { el, name: r.name, x, y });
}
function choose(i) {
  const c = L().check;
  setAnswer(c.answers[i] === 'correct', c.answers[i], undefined, { choice: i });
}

/* 見本で起きたことを、いまの用語に知らせる */
function notify(type, detail = {}) {
  L()?.on?.[type]?.(detail);
}

/* ---- 書き込みを描き直す ---- */
function draw() {
  positionLayer();
  if (state.term === 'favicon') renderChrome();
  overlay.setAttribute('width', site.offsetWidth);
  overlay.setAttribute('height', site.offsetHeight);
  const lesson = L();
  const marks = [defs()];
  const name = (el) => t(`parts.${el.dataset.part}`);

  if (state.step === 'look') {
    marks.push(...lesson.lookMarks(state.pinned));
    if (state.pinned && lesson.items && lesson.items[state.pinned] && lesson.pinMarks !== false) {
      const it = T('look.items').find((x) => x.id === state.pinned);
      marks.push(...annotate(lesson.items[state.pinned](), it.label, { dashed: true }));
    } else if (lesson.hoverNames && state.hover && state.hover !== (lesson.main && lesson.main())) {
      marks.push(...annotate(state.hover, name(state.hover), { dashed: true }));
    }
  }
  if (state.step === 'touch' && lesson.touchMarks) marks.push(...lesson.touchMarks());
  if (state.step === 'check' && state.answer && lesson.check.marks) marks.push(...lesson.check.marks(state.answer));
  overlay.replaceChildren(...marks);
}

/* ---- ホバー：マウスが乗った部品を覚えて、触るでは何が変わったかを知らせる ---- */
const HOVERABLE = { nav: '.s-nav a', btn: '.s-btn', arrow: '.s-arrow', sublink: '.s-sublink', card: '.s-card', foot: '.s-foot-nav a' };
const hoverKind = (el) => Object.keys(HOVERABLE).find((k) => el.matches(HOVERABLE[k]));
function setHoverEl(el) {
  if (el === state.hoverEl) return;
  state.hoverEl = el;
  if (state.step === 'touch' && el) {
    const k = hoverKind(el);
    state.event = T(state.noHover ? 'touch.none' : 'touch.over', { name: T(`touch.names.${k}`), change: T(`touch.changes.${k}`) });
    renderPanel();
  }
  draw();
}
site.addEventListener('pointerover', (e) => {
  if (state.term !== 'hover' || e.pointerType !== 'mouse') return;
  setHoverEl(e.target.closest(Object.values(HOVERABLE).join(', ')));
});
site.addEventListener('pointerleave', () => { if (state.term === 'hover') setHoverEl(null); });

/* ---- 見本のサイトでの操作 ---- */
site.addEventListener('pointermove', (e) => {
  if (state.step !== 'look' || state.pinned || !L().hoverNames) return;
  const el = e.target.closest('[data-part]');
  if (el !== state.hover) { state.hover = el; draw(); }
});
site.addEventListener('pointerleave', () => {
  if (state.step !== 'look' || state.pinned) return;
  state.hover = null;
  draw();
});
// 確かめる（見本をクリックして答える）の間は、見本の部品が動かないようにする
site.addEventListener('mousedown', (e) => {
  if (isQuiz() && e.target.closest('select, input, textarea')) e.preventDefault();
}, true);
site.addEventListener('click', (e) => {
  if (isQuiz()) {
    e.preventDefault();
    const s = site.getBoundingClientRect();
    answer(e.target, e.clientX - s.left, e.clientY - s.top);
    return;
  }
  const link = e.target.closest('a');
  if (link) {
    e.preventDefault();  // 見本のリンクは、用語が許すときだけ本当に移動する
    const lesson = L();
    if (link.dataset.go && lesson.allowNav?.(link)) {
      const target = link.dataset.go;
      const label = link.querySelector('.name')?.firstChild.textContent ?? link.textContent;  // カードは商品名だけ
      // どこのリンクから移動したか（移動するとパンくずリストは作り直されるので、先に調べる）
      const from = ['crumbs', 'nav', 'drawer', 'footer', 'card', 'logo'].find((k) => link.closest(`.s-${k}`)) || 'other';
      if (state.layer) { state.navigating = true; closeLayer('nav'); state.navigating = false; }
      go(target);
      notify('go', { target, label, from });
      draw();
      return;
    }
  }
  if (state.step === 'look' && L().hoverNames) {
    if (state.pinned) { state.pinned = null; renderPanel(); }
    state.hover = e.target.closest('[data-part]');
    draw();
  }
});
site.addEventListener('keydown', (e) => {
  if (!isQuiz() || (e.key !== 'Enter' && e.key !== ' ')) return;
  const el = e.target.closest('[data-part]');
  if (!el) return;
  e.preventDefault();
  e.stopPropagation();
  const b = boxOf(el);
  answer(el, b.x + Math.min(b.w / 2, 40), b.y + b.h / 2);
});

new ResizeObserver(() => draw()).observe(site);
new ResizeObserver(() => draw()).observe(vp);
// 見本をスクロールしたら、名前を見える位置に書き直す
let drawQueued = false;
vp.addEventListener('scroll', () => {
  if (drawQueued) return;
  drawQueued = true;
  requestAnimationFrame(() => { drawQueued = false; draw(); });
}, { passive: true });

/* ---- 上の帯と用語一覧 ---- */
const list = $('#list');
$('#open-list').addEventListener('click', () => {
  renderList();
  list.showModal();
  list.querySelector('[aria-current="page"]')?.scrollIntoView({ block: 'center' });
});
$('#close-list').addEventListener('click', () => list.close());
list.addEventListener('click', (e) => {
  // 暗い幕（ドロワーの外側）を押したら閉じる
  if (e.target !== list) return;
  const r = list.getBoundingClientRect();
  if (e.clientX > r.right || e.clientX < r.left || e.clientY < r.top || e.clientY > r.bottom) list.close();
});
$('#prev').addEventListener('click', () => { const l = readyTerms(); selectTerm(l[l.indexOf(state.term) - 1]); });
$('#next').addEventListener('click', () => { const l = readyTerms(); selectTerm(l[l.indexOf(state.term) + 1]); });

/* ---- はじめる ---- */
buildSite();
const last = load(LAST_KEY, 'header');
state.term = ready(last) ? last : 'header';
setStep('look');
</script>
</body>
</html>
